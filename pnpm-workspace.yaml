# pnpm settings for this repository (#3673). A single-package repository still
# keeps them here: since pnpm 11 the `pnpm` field of package.json is not read,
# and `.npmrc` carries only registry and auth settings.

# Strict layout (owner decision D2 on #3673): each package sees only the
# dependencies it declares, so an undeclared ("phantom") import fails loudly
# instead of working by accident. This is pnpm's default; it is written down so
# nobody flips it to `hoisted` thinking it is unset.
nodeLinker: isolated

# Match the npm cooldown in .github/dependabot.yml: 7 days in minutes.
minimumReleaseAge: 10080
# Each exclusion below names one exact version and has its own note; remove an
# entry by its own note, never the whole list.
# - nodemailer@10.2.1: grandfather only the version already locked on main when
#   this policy landed (#4455). Published 22 Oct 2026, it otherwise blocks frozen
#   installs on 28 Oct. Future versions still wait seven days; remove this entry
#   after the next Nodemailer update.
# - #4565: follow-redirects@1.16.2 is the fix for GHSA-mrwp-f3q8-3g9p (high). It
#   was published 25 Oct 2026, so it was still inside the cooldown when that
#   advisory turned the required audit red on 30 Oct. Its diff from 1.16.1 was
#   read: `instanceof Array` becomes `Array.isArray`. Remove this entry once
#   1.16.2 is past the cooldown (1 Nov 2026 21:32 UTC; #4567).
minimumReleaseAgeExclude:
  - nodemailer@10.2.1
  - follow-redirects@1.16.2

# The single home of the version range for these two direct dependencies
# (pnpm's "catalog"). package.json names both as `catalog:`, and the nodemailer
# overrides below point here too, so each range is written exactly once; bump
# it here.
catalog:
  nodemailer: ^10.1.4
  sharp: ^0.35.5

# The former npm `overrides` block, translated one entry for one entry, less
# `sharp`, retired in #3673 (see the last point below), and `deepmerge-ts`,
# retired once `@prisma/config` 7.10.1 itself asked for the fixed 8.x. The
# reasons behind each pin are recorded in docs/MAINTENANCE.md.
#
# - `catalog:` pins a transitive copy to this repository's own direct
#   dependency range, which is what npm's `$nodemailer` did. (pnpm
#   still reads `$name` but has deprecated it in favour of catalogs.)
# - `next-auth>nodemailer` replaces npm's nested `"next-auth": { "nodemailer" }`.
#   It is written against both packages that declare the optional nodemailer
#   peer, `next-auth` itself and its `@auth/core`, because npm's nested form
#   applied to the whole subtree under `next-auth` and pnpm's `>` form names a
#   direct parent only.
# - No override names a package this repository also depends on directly. A
#   bare `sharp` override (retired in #3673: next itself now requires
#   ^0.35.4) rewrote this repository's own `sharp: "catalog:"` in the
#   lockfile, and pnpm's pre-run check (`verifyDepsBeforeRun`, below) compares
#   package.json with the lockfile WITHOUT applying overrides. The two then
#   disagreed, and every `pnpm run` failed with "The lockfile ... does not
#   satisfy project of id ." once package.json was newer than the last
#   install: a branch switch, or a Docker builder stage whose dependency layer
#   came from the cache. Scope an override to its parent (`parent>name`).
overrides:
  eslint-plugin-react-hooks: 7.1.1
  postcss: ^8.5.26
  next-auth>nodemailer: "catalog:"
  "@auth/core>nodemailer": "catalog:"
  browserslist: ^4.28.7
  ajv>fast-uri: ^3.1.9

# Dependencies allowed to run install scripts, pinned to the exact version that
# was reviewed. pnpm runs none by default and fails the install on any build it
# was not told about (`strictDepBuilds`, pnpm's default), so a new dependency
# that wants to run code at install time — or a new version of one below — is a
# reviewed edit to this list, not a silent side effect. The failure reads
# `ERR_PNPM_IGNORED_BUILDS` and names the package: look at what its install
# script does in the new version, then move the version here. pnpm accepts
# exact versions (or `a || b` unions) here, not ranges. This is the npm
# `allowScripts` field's intent, which was also version-keyed.
#
# `core-js: false` is a deliberate denial rather than an omission: its
# postinstall only prints a funding banner, and nothing here needs it run.
allowBuilds:
  "@prisma/engines@7.10.1": true
  core-js: false
  esbuild@0.28.1: true
  prisma@7.10.1: true
  unrs-resolver@1.12.2: true

# Before `pnpm run` / `pnpm exec`, pnpm checks node_modules against the lockfile.
# pnpm 11's default answer to a mismatch is to run a NON-frozen install, which
# can rewrite pnpm-lock.yaml without anybody asking — and AGENTS.md lets an
# implementor install only when explicitly authorised. `error` stops and says
# so instead; run `pnpm install` yourself (#3673).
verifyDepsBeforeRun: error

# The virtual store stays inside each worktree's own node_modules/.pnpm. With a
# global virtual store the per-worktree links would point into one shared tree,
# and `prisma generate` would write one lane's client where every lane reads it
# (docs/agents/CODEX_WORKFLOW.md, "Require an isolated dependency tree"). This
# is pnpm 11's default for a project; it is written down so nobody turns it on.
enableGlobalVirtualStore: false
