x-app-environment: &app-environment
  TZ: Pacific/Auckland
  # Is this installation the club's LIVE site, or a copy of it (ENV-SAFETY 1
  # #3034, epic #2986)? Exactly `production` or `non-production`, and there is
  # DELIBERATELY NO `:-` DEFAULT: a default here would be the silent inference
  # this whole epic exists to remove — one that would be wrong for every fork and
  # every restored copy, in the direction that emails the club's real members from
  # a test system. An unset variable makes the app resolve UNKNOWN and hold back
  # member email and Xero writes until an operator declares it, which is loud and
  # safe; a `:-production` would be quiet and wrong.
  #
  # NOT the same thing as APP_RUNTIME_ROLE below, which names which container SLOT
  # this is (web-blue / web-green / cron-leader / staging). That is a deployment
  # naming convention and is never read to decide whether this is production.
  #
  # scripts/run-production-blue-green-deploy.sh refuses to deploy without it, at
  # step 3 of 20 — before the migration and long before cutover. Compose itself
  # will pass an empty value through with a warning; that is the correct outcome
  # for an operator running `docker compose up` by hand, because the app then says
  # exactly what is missing on /admin/setup rather than guessing.
  APP_ENVIRONMENT_ROLE: ${APP_ENVIRONMENT_ROLE}
  # Default DATABASE_URL for the WEB slots (app_blue / app_green). Prisma's
  # connection_limit is the hard pool ceiling per container. Advisory-lock
  # waiters hold their connection while blocked, so a single-lodge booking
  # burst on a 5-conn pool exhausts it and stalls every other request
  # (#1884, F17). Raised to 10 for headroom under ~100 concurrent users.
  #
  # Postgres runs max_connections=40 (see the postgres service). The Prisma
  # pools sum to blue(10) + green(10) + cron(5) = 25 steady, + migrate(2) in a
  # deploy window = 27. Raised from 30 after production transiently hit `FATAL:
  # sorry, too many clients`: at 30 the worst case (27) sat one slot under the
  # ceiling, so a nightly pg_dump, the deploy-time shadow DB, a pg_isready
  # probe, or an operator psql tipped it over.
  #
  # NOTE the app role `tac` is a Postgres SUPERUSER (POSTGRES_USER), so
  # superuser_reserved_connections does NOT hold slots back from the app's own
  # pools — once the pools fill the ceiling even an admin psql is refused (which
  # is why the "reserved" slots gave no emergency headroom at 30). Accepted here:
  # the pools are hard-capped (27) well under 40, so the margin covers admin in
  # practice; a dedicated NOSUPERUSER app role would restore a truly protected
  # slot if a future change ever makes the margin tight.
  # So the 40 ceiling is raw headroom, not a reservation: budget EVERY consumer,
  # not just the Prisma pools —
  #   sum(pools) + pg_dump + shadow DB + probes + admin psql <= max_connections.
  # A constrained-VPS fork may lower max_connections AND the postgres mem_limit
  # together. See DEPLOYMENT.md "Connection pool sizing".
  DATABASE_URL: postgresql://tac:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/tacbookings?connection_limit=10&pool_timeout=10
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET}}
  AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
  # Stripe credentials are DB-only (#2082): the secret key, publishable key, and
  # webhook signing secret are captured in-app and stored encrypted — no STRIPE_*
  # env vars are read (and the publishable key is delivered at runtime, not
  # inlined at build time).
  ADDY_API_KEY: ${ADDY_API_KEY:-}
  ADDY_API_SECRET: ${ADDY_API_SECRET:-}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  USE_AWS_SES: ${USE_AWS_SES:-true}
  USE_SMTP_RELAY: ${USE_SMTP_RELAY:-false}
  # Declares that the SMTP relay above is a CAPTURE mailbox which forwards mail
  # nowhere (mailpit, MailHog, a developer's sink) — ENV-SAFETY 2 (#3035),
  # INV-CONFIG-004. It must be listed HERE, in the anchor, not only in an env
  # file: `--env-file` feeds Compose INTERPOLATION only and injects nothing into
  # a container, so a variable that is not named in this map does not exist for
  # the app however carefully the env file sets it. That is exactly how the
  # first cut of #3035 shipped an E2E stack whose mailbox stayed empty.
  # Defaults false — a capture transport is a declaration, never an inference.
  USE_LOCAL_CAPTURE: ${USE_LOCAL_CAPTURE:-false}
  # Allows the capture declaration above when EMAIL_SERVER_HOST is a host on the
  # public internet (#3071 review). Listed HERE for exactly the reason the comment
  # above gives: a variable absent from this map does not reach the container, so
  # an operator setting it in an env file would find their capture still refused
  # and nothing explaining why. Defaults false — the refusal is the safe answer,
  # and overriding it asserts something no check can verify.
  EMAIL_CAPTURE_ALLOW_PUBLIC_HOST: ${EMAIL_CAPTURE_ALLOW_PUBLIC_HOST:-false}
  EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
  EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-}
  EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
  EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
  BULK_SENDMAIL_LIMIT: ${BULK_SENDMAIL_LIMIT:-1}
  AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID}
  AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY}
  SES_SNS_TOPIC_ARN: ${SES_SNS_TOPIC_ARN}
  SES_SNS_ALLOW_UNSAFE_MISSING_TOPIC_ARN: ${SES_SNS_ALLOW_UNSAFE_MISSING_TOPIC_ARN:-false}
  # Temporary opt-in to legacy SNS SignatureVersion 1 (SHA1) during a topic
  # migration (#815), read in src/lib/ses-sns.ts. Documented in .env.example but
  # named in no Compose file, so an operator mid-migration could not set it; the
  # env-delivery census added under #3035 surfaced that. Behaviour-neutral:
  # undefined already means "refuse SHA1", which is what `false` means here.
  SES_SNS_ALLOW_SIGNATURE_V1: ${SES_SNS_ALLOW_SIGNATURE_V1:-false}
  # EMAIL_FROM is the only email-identity env var (besides transport secrets):
  # the envelope / Return-Path sender, which must be a provider-verified (SES)
  # address. From display name, support address, and contact-form recipient are
  # admin-managed DB-first (Admin > Email Messages / EmailMessageSetting).
  EMAIL_FROM: ${EMAIL_FROM}
  CRON_SECRET: ${CRON_SECRET}
  # AI Diagnostics (#2374, ADR-007): a DEDICATED non-superuser SELECT-only role for
  # the diagnostics tool substrate. Deliberately NOT derived from DATABASE_URL —
  # `tac` above is a SUPERUSER, and the whole point of this credential is that the
  # database itself makes a diagnostics read incapable of writing or of reading the
  # encrypted credential store. Empty by default (the module ships off); provision
  # with `npm run diagnostics:provision-role` and set it in the Compose .env.
  # The app refuses every diagnostics read unless the server confirms the role is
  # least-privilege, so an empty or wrong value degrades safely.
  AI_DIAGNOSTICS_DATABASE_URL: ${AI_DIAGNOSTICS_DATABASE_URL:-}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  SEED_LODGE_PASSWORD: ${SEED_LODGE_PASSWORD:-}
  LEGACY_DASHBOARD_EXPORT_TOKEN: ${LEGACY_DASHBOARD_EXPORT_TOKEN:-}
  CRON_ENABLED: ${CRON_ENABLED:-true}
  # Backups are configured in-app and stored encrypted (#2095); only the nightly
  # schedule stays in the environment. The legacy BACKUP_ENABLED / BACKUP_S3_* /
  # BACKUP_RETENTION_DAYS / BACKUP_RESTORE_VALIDATION_URL vars are no longer read
  # and are intentionally not passed through.
  BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
  # Where local database backups are written INSIDE the container — the path an
  # admin enters on /admin/backups, and the default that page pre-fills. It must
  # match the mount target on the app service below, which is why both read the
  # same variable. The HOST side of that mount is BACKUP_LOCAL_HOST_DIR, which
  # the app never sees and must never be given: a host path is not visible from
  # inside the container.
  BACKUP_LOCAL_DIR: ${BACKUP_LOCAL_DIR:-/backups}
  # Where message-board images are written INSIDE the container (epic #2992).
  # Same shape as BACKUP_LOCAL_DIR above and for the same reason: it must match
  # the mount target on the app service, so both read one variable. The HOST
  # side is POST_IMAGE_HOST_DIR, which the app never sees and must never be
  # given — a host path is not visible from inside the container.
  POST_IMAGE_DIR: ${POST_IMAGE_DIR:-/images}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}
  NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
  SENTRY_ORG: ${SENTRY_ORG:-}
  SENTRY_PROJECT: ${SENTRY_PROJECT:-}
  SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
  # MiroTalk video-meeting base URL (calendar events). Runtime, server-side only
  # — join links are built as <MIROTALK_URL>/join/<room>. Empty is DERIVED in code
  # from the app domain (NEXTAUTH_URL) as https://meet.<domain>, falling back to
  # http://localhost:3010 only for a loopback app host.
  MIROTALK_URL: ${MIROTALK_URL:-}
  # MiroTalk JWT access (optional). When MIRO_JWT_KEY (matching MiroTalk's
  # JWT_KEY) plus a HOST_USERS credential are set, the join link carries a
  # short-lived signed token so committee members skip MiroTalk's host login.
  # All server-side secrets — never exposed to the browser.
  MIRO_JWT_KEY: ${MIRO_JWT_KEY:-}
  MIRO_JWT_EXP: ${MIRO_JWT_EXP:-1h}
  MIRO_MEETING_USERNAME: ${MIRO_MEETING_USERNAME:-}
  MIRO_MEETING_PASSWORD: ${MIRO_MEETING_PASSWORD:-}
  MIRO_MEETING_PRESENTER: ${MIRO_MEETING_PRESENTER:-true}
  # TEST-ONLY mock-Xero E2E harness (#2080). Empty in every real deployment, so
  # the mock endpoints 404 and the OAuth/org code path is unchanged. The E2E
  # staging stack sets API_ORIGIN to the BROWSER-reachable origin (the consent
  # URL the operator's browser follows, e.g. the host-mapped :3001) and
  # INTERNAL_ORIGIN to the app's container-internal self-origin (:3000) for
  # server-side token/organisation calls; INTERNAL falls back to API_ORIGIN.
  XERO_MOCK_API_ORIGIN: ${XERO_MOCK_API_ORIGIN:-}
  XERO_MOCK_INTERNAL_ORIGIN: ${XERO_MOCK_INTERNAL_ORIGIN:-}
  # ------------------------------------------------------------------
  # Settings that were DOCUMENTED but not DELIVERED, until #3035.
  #
  # Every one of these is read by application code and was named in
  # `.env.example` (some also in the CI E2E env blocks) but appeared in no
  # Compose file — and `--env-file` feeds Compose INTERPOLATION only, it injects
  # nothing into a container. So on every Compose deployment an operator could
  # set them, see them in their `.env`, and have them do nothing at all. That is
  # the same defect that made #3035's first cut ship an E2E stack with an empty
  # mailbox, and `env-delivery-census.test.ts` is what surfaced the rest of the
  # family.
  #
  # ALL OF THEM ARE BEHAVIOUR-NEUTRAL TO ADD. Each reader already treats an unset
  # or empty value exactly as it treats the empty default written here, and every
  # place that declares the three Xero flags declares `false`. Nothing about a
  # deployment changes on upgrade; what changes is that setting one now works.
  # ------------------------------------------------------------------
  # Xero optional behaviours — src/lib/xero-feature-flags.ts (undefined = off).
  XERO_ENABLE_DAILY_MEMBERSHIP_REFRESH: ${XERO_ENABLE_DAILY_MEMBERSHIP_REFRESH:-false}
  XERO_ENABLE_LIVE_MEMBER_GROUP_LOOKUPS: ${XERO_ENABLE_LIVE_MEMBER_GROUP_LOOKUPS:-false}
  XERO_ENABLE_AUTOLOAD_XERO_CONTACT_GROUPS: ${XERO_ENABLE_AUTOLOAD_XERO_CONTACT_GROUPS:-false}
  # Operational defaults — src/config/operational.ts falls back to NZD / en-NZ.
  # Only the server-side spellings: the NEXT_PUBLIC_* twins are inlined into the
  # browser bundle at BUILD time, so delivering those at runtime would make the
  # server and the browser disagree. Club time zone is TZ, above.
  CURRENCY: ${CURRENCY:-}
  LOCALE: ${LOCALE:-}
  # Optional separate archive database for AuditLogArchive rows —
  # src/lib/audit-retention.ts (empty = archive to the primary database).
  AUDIT_ARCHIVE_DATABASE_URL: ${AUDIT_ARCHIVE_DATABASE_URL:-}
  AUDIT_LOG_ARCHIVE_DATABASE_URL: ${AUDIT_LOG_ARCHIVE_DATABASE_URL:-}
  # Where Admin > System Health asks the cron leader for its runtime status —
  # src/app/api/admin/health/route.ts, which defaults to the compose-internal
  # http://app:3000/api/deploy/runtime-status when this is empty. `.env.example`
  # already told operators Compose defaults to exactly that.
  CRON_LEADER_RUNTIME_STATUS_URL: ${CRON_LEADER_RUNTIME_STATUS_URL:-}
  # DR / clone bootstrap (ADR-003): a config-transfer bundle imported on boot
  # ONLY when the database holds no non-seed configuration —
  # src/lib/config-transfer/bootstrap-import.ts, which no-ops on an empty value.
  # A container path, so it also needs a mount; empty disables it.
  CONFIG_BUNDLE_IMPORT_PATH: ${CONFIG_BUNDLE_IMPORT_PATH:-}

x-app-service: &app-service
  image: ${APP_IMAGE:-${COMPOSE_PROJECT_NAME:-tacbookings}-app:local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Stripe publishable key is delivered at runtime from the DB store (#2082),
      # not inlined at build time — no NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY arg.
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # AID-3 (#2372): the deploy runner exports these so the in-builder
      # knowledge-bundle generator stamps a verified, reproducible bundle.
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      KNOWLEDGE_BUNDLE_OBSERVED_AT: ${KNOWLEDGE_BUNDLE_OBSERVED_AT:-}
      # Optional Node flags for the BUILD only — see the ARG in the Dockerfile.
      # Empty unless an operator sets NODE_BUILD_OPTIONS, so this changes nothing
      # for a deployment that does not need it. Typical use is raising the heap
      # on a small server whose `next build` is being OOM-killed:
      #   NODE_BUILD_OPTIONS=--max-old-space-size=4096
      NODE_OPTIONS: ${NODE_BUILD_OPTIONS:-}
      # #2352 D1: the release identifier the per-release public-website CSP nonce
      # is derived from. A BUILD arg, not a runtime env var, deliberately — the
      # value has to be fixed for the life of the image so a page stored by one
      # process still hydrates when another process of the same release serves it.
      # The deploy runner exports it alongside GIT_COMMIT_SHA.
      RELEASE_ID: ${RELEASE_ID:-${GIT_COMMIT_SHA:-}}
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp
    # Explicit size cap (#2352). Without one, a tmpfs defaults to HALF THE HOST'S
    # RAM, and anything written here counts against this container's `mem_limit`
    # below — so an unbounded mount is a memory limit that can be reached by
    # writing files. What writes here is Next's fetch cache and the image
    # optimiser's output, both of which grow with use and neither of which prunes
    # itself. 64m is generous for both and small enough that filling it cannot
    # threaten the 1g limit.
    #
    # NOT the full-route (ISR) page cache, despite the path suggesting otherwise:
    # Next stores those under `.next/server/app`, which is read-only here, so
    # `next.config.ts` keeps them in a bounded in-memory LRU instead. That file
    # explains the whole decision — read it before changing either side.
    - /app/.next/cache:uid=1001,gid=1001,mode=0755,size=64m
  # Image Manager uploads. A named volume shared by all app replicas keeps
  # uploads persistent across redeploys and visible to every instance (the
  # read-only root filesystem above otherwise has no writable path here). The
  # volume inherits uid 1001 ownership from the image's /app/public/images on
  # first init (see Dockerfile), so the app user can write to it.
  volumes:
    - image_uploads:/app/public/images
    # Local database backups (see BACKUP_LOCAL_DIR above). The default is a NAMED
    # VOLUME, so a club that never enables local backups gets no stray directory
    # on the host and no ownership to fix — Docker treats a value with no slash
    # as a volume name. Set BACKUP_LOCAL_HOST_DIR to an absolute host path and
    # the same line becomes a bind mount, which is what you want when the files
    # have to be copied off the machine.
    #
    # A bind-mounted host directory must be owned by uid 1001, the user the app
    # runs as (`sudo chown -R 1001:1001 <dir>`); the named-volume default
    # inherits that ownership from /backups in the image, exactly as
    # image_uploads does. The read-only root filesystem does not block either:
    # `read_only: true` applies to the image layers, never to a mount.
    - ${BACKUP_LOCAL_HOST_DIR:-backup_data}:${BACKUP_LOCAL_DIR:-/backups}
    # Message board images (epic #2992). Identical mechanics to the backup
    # mount above: a value with no slash is a NAMED VOLUME, so a club that
    # never uses the board gets no stray host directory and no ownership to
    # fix; set POST_IMAGE_HOST_DIR to an absolute host path and the same line
    # becomes a bind mount. A bind-mounted host directory must be owned by uid
    # 1001 (`sudo chown -R 1001:1001 <dir>`).
    #
    # Deliberately NOT under /app: the read-only root filesystem is not the
    # reason — a mount is writable either way — but anything under the app
    # directory is web-served without a session check, and these images are
    # members-only.
    - ${POST_IMAGE_HOST_DIR:-post_image_data}:${POST_IMAGE_DIR:-/images}
  security_opt:
    - no-new-privileges:true
  mem_limit: 1g
  # Deliberately NO CPU control here (#2351) — no "cpus" cap, and no explicit
  # "cpu_shares" either. A cold page render costs seconds of V8 re-warm CPU
  # work (measured ~3.5-5 CPU-seconds per route on a production deployment,
  # where per-route optimised code was flushed within ~10s of idleness), and
  # that work parallelises across cores — so the app should burst into
  # whatever cores the host has idle; a previous hard cap of 0.8 CFS-throttled
  # those renders into 4-13s page loads. Leaving cpu_shares unset is
  # deliberate too: an explicit value maps inconsistently between cgroup v1
  # and v2 (on v2, an explicit 1024 becomes weight 39 vs the default 100,
  # silently DEPRIORITISING the container), while unset gives every container
  # the kernel's equal default weight on either version — competition, when
  # it happens, splits CPU evenly. Works unchanged on any host size, 1-core
  # VPS included. To impose an absolute ceiling (shared host), add a "cpus:"
  # override in your fork — see DEPLOYMENT.md ("App CPU sizing").
  healthcheck:
    test:
      [
        "CMD-SHELL",
        '(test -n "$AUTH_SECRET" || test -n "$NEXTAUTH_SECRET") && test -n "$CRON_SECRET" && wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1',
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: tac
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: tacbookings
      TZ: Pacific/Auckland
      PGTZ: Pacific/Auckland
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      # Sized so the deploy-window pool worst case (blue+green web + cron +
      # migrate = 27) clears with headroom for the NON-pool consumers (pg_dump,
      # shadow DB, probes, admin psql). The app role is a superuser, so the 3
      # superuser-reserved slots do NOT protect admin access — see the
      # connection-budget note on x-app-environment and DEPLOYMENT.md.
      - "max_connections=40"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    # 768m (up from 512m) covers the extra backends allowed by max_connections=40
    # plus their per-connection work_mem. ~256m more per host; negligible on any
    # host with >1GiB free.
    mem_limit: 768m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tac -d tacbookings"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    <<: *app-service
    environment:
      <<: *app-environment
      APP_RUNTIME_ROLE: cron-leader
      # Cron-leader keeps the original 5-conn pool: its workload is scheduled
      # background jobs, not the concurrent web burst the slots above size for.
      # Holding it at 5 keeps the total within max_connections=40 (#1884, F17).
      DATABASE_URL: postgresql://tac:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/tacbookings?connection_limit=5&pool_timeout=10

  app_blue:
    <<: *app-service
    environment:
      <<: *app-environment
      APP_RUNTIME_ROLE: web-blue
      CRON_ENABLED: "false"

  app_green:
    <<: *app-service
    environment:
      <<: *app-environment
      APP_RUNTIME_ROLE: web-green
      CRON_ENABLED: "false"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # MiroTalk video-meeting reverse proxy (see the meet block in Caddyfile).
      # MEET_HOST = the exact public hostname (e.g. meet.lwtc.org.nz).
      # MIROTALK_UPSTREAM = where Caddy reaches MiroTalk (host.docker.internal:3010
      # for a host `docker run`, or a compose service name).
      MEET_HOST: ${MEET_HOST:-meet.localhost}
      MIROTALK_UPSTREAM: ${MIROTALK_UPSTREAM:-host.docker.internal:3010}
    # Lets the Caddy container reach a MiroTalk started with its own `docker run`
    # via host.docker.internal (Linux needs this mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./deploy/caddy:/etc/caddy/deploy:ro
      - caddy_data:/data
      - caddy_config:/config

  migrate:
    image: ${MIGRATE_IMAGE:-${COMPOSE_PROJECT_NAME:-tacbookings}-migrate:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # AID-3 (#2372): mirror the app image's bundle build metadata.
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
        KNOWLEDGE_BUNDLE_OBSERVED_AT: ${KNOWLEDGE_BUNDLE_OBSERVED_AT:-}
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Pacific/Auckland
      # APP_ENVIRONMENT_ROLE is deliberately ABSENT here, and that is not an
      # oversight: this service runs `prisma migrate deploy` and nothing else. It
      # imports no application code, so it never resolves an environment role and
      # has nothing to decide with one. Every service that runs the APP takes the
      # variable through the x-app-environment anchor above.
      # Bound the deploy-window migrate pool to 2 so a blue/green overlap that
      # also runs migrations still fits: blue(10)+green(10)+cron(5)+migrate(2)
      # = 27, within the max_connections=40 ceiling. The headroom above 27 is
      # for non-pool consumers (pg_dump / shadow DB / probes / psql), not a
      # reserved admin slot — see the budget note on x-app-environment
      # (#1884, F17). migrate only needs a couple of connections for
      # `prisma migrate deploy`.
      DATABASE_URL: postgresql://tac:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/tacbookings?connection_limit=2&pool_timeout=10
    command: ./node_modules/.bin/prisma migrate deploy

volumes:
  postgres_data:
  # Default destination for local database backups when BACKUP_LOCAL_HOST_DIR
  # names no host directory. Deliberately NOT pruned by any tooling here: it
  # holds the club's own backups.
  backup_data:
  caddy_data:
  caddy_config:
  image_uploads:
  # Default destination for message-board images when POST_IMAGE_HOST_DIR names
  # no host directory. Like backup_data it is NOT pruned by any tooling here: it
  # holds members' own photographs.
  post_image_data:
