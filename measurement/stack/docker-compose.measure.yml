# Measurement-stack override for the #2352 slice-1 staging evaluation.
#
# Used together with the repo's base docker-compose.yml (NOT the staging
# override), compose project `tacbookings-measure`, so the stack keeps the
# production shape: read-only root fs, tmpfs /tmp + /app/.next/cache (64m),
# image_uploads volume, mem_limit 1g, no-new-privileges, Caddy in front.
#
#   docker compose --env-file measurement/stack/.env.measure \
#     -p tacbookings-measure --project-directory . \
#     -f docker-compose.yml -f measurement/stack/docker-compose.measure.yml \
#     up -d --wait postgres app caddy
#
# Isolation: unique project name, host ports 3003 (app, loopback), 5435
# (postgres, loopback), 8027 (caddy, loopback), 8127 (mailpit UI, loopback).
# Never touches the tacbookings-staging stack (3001/5433/8025) or production.
#
# Deviations from production, all recorded in measurement/phase1/NOTES.md:
#  - cpus: 1.0 on the app container (production deliberately uncaps CPU, #2351;
#    the owner's Option A spec requires explicit limits for the comparison).
#  - KEEP_ALIVE_TIMEOUT=65000: the repo's own documented harness accommodation
#    (docs/E2E_PLAYWRIGHT.md "keep-alive socket race"); affects idle sockets
#    only, not request handling.
#  - Caddy serves plain http on :8027 via Caddyfile.staging, the repo's hosted
#    staging proxy config, which mirrors the production Caddyfile's headers,
#    /images handler and forwarded-header behaviour (TLS termination excluded).
#  - mailpit SMTP capture so any incidental outbound email succeeds quietly
#    instead of polluting the error-noise check. No live providers anywhere.
#    NOTE from #3034: this stack declares APP_ENVIRONMENT_ROLE=non-production, so
#    once #3035 lands its application-controlled sends are WITHHELD at the
#    delivery boundary rather than relayed to mailpit. That keeps the
#    error-noise premise (nothing is attempted against a live provider) and
#    strengthens it; a scenario that ever needs a message to actually arrive here
#    will need to say so rather than assume the relay.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5435:5432"

  app:
    image: ${MEASURE_APP_IMAGE:?set MEASURE_APP_IMAGE to the exact immutable measurement image}
    ports: !override
      - "127.0.0.1:3003:3000"
    # Explicit CPU ceiling for the measurement (owner Option A spec). Memory
    # stays the production mem_limit: 1g from the base file.
    cpus: 1.0
    environment:
      # This stack is a COPY, always, by construction (ENV-SAFETY 1 #3034, epic
      # #2986). It is used with the BASE docker-compose.yml, which passes
      # ${APP_ENVIRONMENT_ROLE} through with no default, and there is no tracked
      # .env.measure to supply one — so without this line the measurement app
      # resolves UNKNOWN, the boot advisory logs an error on EVERY recreate, and
      # MC-09 in measurement/current-main-refresh/run-log-noise.sh fails on a
      # warning/error signature repeated three times. Eight of the eleven
      # producers `--force-recreate app` inside their own `docker logs --since`
      # window, so one line per boot is ten-plus occurrences of one signature.
      # Hard-coded rather than interpolated, exactly as docker-compose.staging.yml
      # does it: a stray value in an env file must not be able to make a
      # measurement stack claim to be the club's live site.
      APP_ENVIRONMENT_ROLE: non-production
      APP_RUNTIME_ROLE: web-measure
      CRON_ENABLED: "false"
      NEXTAUTH_URL: http://localhost:8027
      AUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      KEEP_ALIVE_TIMEOUT: "65000"
      LOG_LEVEL: info
      USE_AWS_SES: "false"
      USE_SMTP_RELAY: "false"
      # ENV-SAFETY 2 (#3035): this stack declares itself non-production, and a
      # non-production installation suppresses every send unless its transport is
      # DECLARED to be a capture mailbox. mailpit is one, so say so — otherwise
      # this harness measures a stack that never sends anything.
      USE_LOCAL_CAPTURE: "true"
      EMAIL_SERVER_HOST: mailpit
      EMAIL_SERVER_PORT: "1025"
      EMAIL_SERVER_USER: measurement
      EMAIL_SERVER_PASSWORD: measurement-only
      EMAIL_FROM: noreply@measurement.invalid
      SMTP_HOST: ""
      SMTP_PORT: ""
      AWS_SES_ACCESS_KEY_ID: ""
      AWS_SES_SECRET_ACCESS_KEY: ""
      SES_SNS_TOPIC_ARN: ""
      SES_SNS_ALLOW_UNSAFE_MISSING_TOPIC_ARN: "false"
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_ORG: ""
      SENTRY_PROJECT: ""
      SENTRY_AUTH_TOKEN: ""
      ADDY_API_KEY: ""
      ADDY_API_SECRET: ""
      LEGACY_DASHBOARD_EXPORT_TOKEN: ""
      AI_DIAGNOSTICS_DATABASE_URL: ""
      MIROTALK_URL: ""
      MIRO_JWT_KEY: ""
      MIRO_MEETING_USERNAME: ""
      MIRO_MEETING_PASSWORD: ""
      MIRO_MEETING_PRESENTER: ""
      XERO_MOCK_API_ORIGIN: ""
      XERO_MOCK_INTERNAL_ORIGIN: ""
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
      SEED_ADMIN_EMAIL: ""
      SEED_ADMIN_PASSWORD: ""
      SEED_LODGE_PASSWORD: ""
      # The production WEB-slot pool (app_blue/app_green use connection_limit=10;
      # the base `app` service is the cron-leader on 5, which is not the shape
      # being measured).
      DATABASE_URL: postgresql://tac:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/tacbookings?connection_limit=10&pool_timeout=10
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Non-production SMTP capture (same image/config as the repo's staging
  # override) so resolveEmailDeliveryConfig is valid and no live provider is
  # ever contacted.
  mailpit:
    image: axllent/mailpit:v1.30.3
    restart: unless-stopped
    environment:
      TZ: Pacific/Auckland
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8127:8025"
    mem_limit: 128m
    cpus: 0.2

  # Blue/green slots are the deploy runner's concern; the measurement runs one
  # web-shaped app container. Parking them behind a profile disables them — but
  # they still DECLARE the role, because a profile is a switch somebody can turn
  # on and an app service that runs here without a declaration is the same
  # UNKNOWN-on-boot hole as the one above. Asserted by the compose census in
  # src/lib/__tests__/deploy-environment-role-contract.test.ts.
  app_blue:
    profiles: ["production-bluegreen"]
    environment:
      APP_ENVIRONMENT_ROLE: non-production
  app_green:
    profiles: ["production-bluegreen"]
    environment:
      APP_ENVIRONMENT_ROLE: non-production

  caddy:
    ports: !override
      - "127.0.0.1:8027:8027"
    environment:
      DOMAIN: 127.0.0.1
      # The exact loopback authority every part of this harness pins:
      # validate-orchestrator-inputs.mjs demands http://127.0.0.1:8027, and both
      # runners send every producer and timed request to it. Caddy serves only
      # the host in its site address, so while this said `localhost:8027` a
      # request carrying Host `127.0.0.1:8027` matched no site and Caddy
      # answered an empty 200 — a body-less success that would have been
      # measured as a very fast cached page. Must stay byte-identical to
      # CORRECTNESS_BASE_URL / the phase-2 BASE.
      STAGING_CADDY_SITE: http://127.0.0.1:8027
    volumes: !override
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
