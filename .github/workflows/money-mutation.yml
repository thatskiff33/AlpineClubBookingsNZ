name: Money mutation

# Mutation testing of the ledger, refund and settlement modules with Stryker
# (#4459, programme #4450): the job changes the code a little (flips a sign,
# drops a guard, moves a boundary) and reports every change the unit tests did
# NOT notice. A surviving mutant is a place where the code could be wrong and
# the tests would still pass.
#
# DELIBERATELY NOT A PULL-REQUEST CHECK. It has no `pull_request` trigger: it
# runs nightly and on demand (`workflow_dispatch`), so it can never appear as a
# required check or hold up unrelated work. Do not add one. Branch protection is
# untouched by this file (CONTRIBUTING.md -> "Branch protection").
#
# The modules it mutates and the suites it runs are the lists in
# `scripts/lib/money-modules.mjs`; the floor it must not fall below is the
# baseline in `scripts/ci/money-test-baseline.json`, which Stryker enforces as
# `thresholds.break` (stryker.config.mjs). The report is the HTML artifact; the
# job summary lists the score and the survivors by file and line.
# `docs/TESTING.md` -> "Coverage and mutation testing of the money modules" says
# how to read it and how to run it locally.

on:
  schedule:
    # 14:30 UTC = 02:30 NZST, after the day's merges and the clock canary.
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: money-mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Stryker on the money modules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "false"
      CRON_SECRET: ci-cron-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tacbookings
      STRIPE_SECRET_KEY: sk_test_fake
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake
      XERO_ENABLE_DAILY_MEMBERSHIP_REFRESH: "false"
      XERO_ENABLE_LIVE_MEMBER_GROUP_LOOKUPS: "false"
      XERO_ENABLE_AUTOLOAD_XERO_CONTACT_GROUPS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pnpm version comes from `packageManager` in package.json (#3673).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      # Fails the job when the score is under the floor (`thresholds.break`).
      - name: Run Stryker
        run: pnpm run mutation

      # Runs after a failed Stryker step too, so the summary names the survivors
      # whenever the score dropped.
      - name: Summarise the score and the survivors
        if: ${{ !cancelled() }}
        run: node scripts/ci/money-test-ratchet.mjs mutation

      - name: Keep the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: money-mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: warn
