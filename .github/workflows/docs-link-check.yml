name: Docs link check

# Verifies that relative links between Markdown docs resolve. This is a NEW,
# separate workflow/job (issue #2049) — it deliberately does not touch or rename
# any branch-protection-required check (verify, Migration drift check,
# Playwright E2E, E2E multi-lodge, Static analysis gate).
#
# It runs lychee in OFFLINE mode: only local file links (and their fragments)
# are checked, never external URLs, so the job is deterministic and never flakes
# on a third-party site being down. External-URL health, if ever wanted, should
# be a separate scheduled, non-blocking job.
#
# Until an owner adds "Docs link check" to the required status checks it is
# advisory (start non-blocking, promote to blocking later — the accepted path).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Pull-request runs cancel superseded runs. Pushes to main share the group
# without cancelling a run in progress, so a newer merge replaces only main's
# queued run (#5356, INV-OPS-021 in docs/invariants/operations.md).
# Pinned by scripts/ci/main-push-superseded-runs.test.ts.
concurrency:
  group: docs-link-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  link-check:
    name: Markdown relative-link check (offline)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fast, dependency-free sanity check that mirrors what contributors run
      # locally via `pnpm run docs:linkcheck`. Catches most breaks even if the
      # lychee action has an outage.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run repo link checker
        run: node scripts/check-doc-links.mjs

      # Authoritative offline link check (config in lychee.toml). Also validates
      # in-file fragments/anchors, which the Node checker does not.
      - name: Run lychee (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Pin the lychee binary for reproducibility (repo pinning convention).
          # --include-fragments validates in-file anchors; it MUST be a CLI flag,
          # not a lychee.toml key (the config key is rejected by this version and
          # aborts the run — see lychee.toml). Verified: 191 OK / 0 errors.
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress "./**/*.md"
          fail: true
