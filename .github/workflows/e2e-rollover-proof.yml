name: E2E rollover proof

# Runs the browser suite with the RUNNER'S OWN CLOCK parked in the window that
# reddened `main` — the last day of a UTC month, after 12:00 UTC, when New
# Zealand has already been in the next month for hours (#3221).
#
# ## Why this is a separate workflow from `Clock rollover canary`
#
# The unit canary shifts ONE PROCESS with `libfaketime`, chosen deliberately so
# there are no VM-wide side effects and no fight with NTP. That cannot work here.
# The app the browser suite drives is a CONTAINER, and a container reads the host
# kernel clock, which `faketime` does not touch. Shifting only the Playwright
# process would move the runner away from the app — which is the BUG this exists
# to detect, not a test of it. So this job moves the whole VM: the Playwright
# process, the database seed and the app container all advance together, and the
# only thing left to disagree about the date is the code.
#
# ## Why it runs weekly, and why not nightly
#
# It was dispatch-only until 2 September 2026, because its only run had come back
# red and "a nightly nobody trusts is worse than no nightly" (owner decision,
# 1 September). That red turned out to be a live TLS call no clock shift could
# ever have completed rather than a date defect (#3227), and the job now has a
# clean run — 184 passed at the 30 September / 1 October boundary. So it is on a
# schedule, weekly, plus one run before each month-end (owner decision,
# 2 September 2026, #3238).
#
# **The parked instant does not vary between runs.** The shift step below always
# targets the end of the CURRENT UTC month at 14:30Z, so every scheduled run in a
# month parks at the same instant; what changes between them is the CODE. A
# schedule therefore buys "tell me a newly-merged spec has this defect, before a
# real rollover does" — not more instants. That is what makes weekly sufficient
# and nightly mostly a re-proof of the same thing.
#
# The run on the 27th exists because weekly alone can miss the last few days of a
# month, and those are the days where missing it is expensive: the failure lands
# at the rollover, which takes `main` and every open pull request red at once.
# About five times a year the 27th falls on a Sunday and both crons fire; the
# concurrency group never cancels, so the second queues and repeats the first.
# That is a duplicate, not a fault, and de-duplicating it would cost more clarity
# here than the runner minutes are worth.
#
# None of this replaces the three guards that run on EVERY pull request —
# `e2e-club-day-census.test.ts` (no second way to ask what day it is),
# `e2e-club-day-boundary.test.ts` (what the dates come out as at the boundary) and
# `e2e-calendar-navigation.test.ts` (the walk reads the calendar rather than being
# told). Those catch the defect on the pull request that introduces it. This job
# is the end-to-end proof, and it only ever sees what escapes all three.
#
# It has no `pull_request` trigger and must never gain one: it can then never
# become a required check, and never block unrelated work on a clock this
# repository does not control.
#
# See docs/TESTING.md → "The browser suite's clock discipline (it is NOT frozen)".

on:
  schedule:
    # 15:20 UTC Sunday = early Monday morning in New Zealand (03:20 NZST, 04:20
    # NZDT) — after the week's merges, before anyone starts. Offset off the hour
    # and away from `Clock rollover canary`'s `0 14 * * *`, because GitHub's
    # scheduler contends on round times.
    - cron: "20 15 * * 0"
    # And once before each month-end, for the reason in the header. 27 September
    # 2026 is itself a Sunday, so the first of these coincides with a weekly run;
    # that is the duplicate the header describes, not a fault.
    - cron: "20 15 27 * *"
  workflow_dispatch:
    inputs:
      instant:
        description: >-
          UTC instant to park the runner at, e.g. 2026-08-31T14:30:00Z. Leave
          empty for the next month-end at 14:30 UTC, which is the shape that
          fired.
        required: false
        type: string
      scope:
        description: Which specs to run under the shifted clock.
        required: false
        default: all
        type: choice
        options:
          - all
          - date-bearing

permissions:
  contents: read

concurrency:
  # Never cancel: each verdict stands on its own, and a cancelled proof reads as
  # "no problem found" when nothing was actually checked.
  group: e2e-rollover-proof-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rollover-proof:
    name: Browser suite at a month rollover
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      APP_IMAGE: tacbookings-e2e-app:ci
      # The club's zone, as the E2E stack seeds it (docker-compose.yml → TZ).
      # Named here so the proof step can say what it is comparing against.
      CLUB_TIME_ZONE: Pacific/Auckland
    steps:
      # ---------------------------------------------------------------------
      # Everything that needs the network happens BEFORE the clock moves. TLS
      # certificate validation is time-sensitive, and a runner whose clock has
      # jumped forward a month can fail a registry pull for reasons that have
      # nothing to do with this repository.
      # ---------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers

      # Counting and listing the specs below IMPORTS every spec file, and
      # `e2e/pre-setup/` reaches `@prisma/client` at module scope through
      # `e2e/helpers/setup-state.ts`. Without this the listing dies on an
      # ungenerated client, which is a confusing way to fail a step that is only
      # counting files (measured on dispatch 33565401713). The staging stack
      # generates its own client again later against the real host URL; this one
      # exists so the count can be taken before the clock moves.
      #
      # `prisma generate` reads the schema and writes a client. It opens NO
      # connection, so the placeholder below is never dialled — it is there
      # because the config loader insists the variable resolves to something.
      - name: Generate the Prisma client, so the specs can be imported
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:1/placeholder
        run: npx prisma generate

      # ---------------------------------------------------------------------
      # Which specs this clock can honestly run — settled BEFORE it moves.
      #
      # The whole VM goes forward, and the app container goes with it. A spec
      # that drives the app into a REAL outbound TLS call is then met by a
      # certificate that, in the container's own reckoning, expired weeks ago:
      # Node refuses the handshake with CERT_HAS_EXPIRED, the payment intent is
      # never created, the Payment Element never mounts, and the spec times out
      # waiting for an iframe that was never going to appear. That is what
      # reddened this job's first dispatch (#3227), and it is not a date defect.
      #
      # No clock shift can fix it — the certificate is not ours to reissue — so
      # those specs come out of the run and the job says so out loud. What is
      # left is a verdict that means what it says: a failure here is a date
      # defect and nothing else. The cost, stated plainly because it is real:
      # the payment journeys are never exercised under a shifted clock, and a
      # spec is excluded whole, so any non-payment test sharing its file goes
      # with it. `docs/TESTING.md` records both.
      # ---------------------------------------------------------------------
      - name: Work out which specs this clock can honestly run
        env:
          # `|| 'all'` is load-bearing, not decoration. On a `schedule` event the
          # `inputs` context is EMPTY, and the `default: all` above applies only
          # to `workflow_dispatch` — so a scheduled run arrives here with an
          # empty scope. Without the fallback it would still run the whole suite,
          # but only by failing the `date-bearing` comparison below and falling
          # through, which is the same thing an unrecognised value would do.
          # Resolve it here, and refuse anything unrecognised, so "what this run
          # covers" is never decided by a string nobody checked.
          RUN_SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          set -euo pipefail

          case "$RUN_SCOPE" in
            all|date-bearing) ;;
            *)
              echo "::error::Unrecognised scope '${RUN_SCOPE}'. It must be 'all' or 'date-bearing'. Refusing to guess: guessing here means silently running a different set of specs than the verdict will claim." >&2
              exit 1
              ;;
          esac

          # DERIVED FROM THE IMPORT, never a hand-kept list. "The Stripe specs"
          # written down as names is stale the first time somebody writes a
          # third one, and it goes stale silently — in the direction of a red
          # that the next reader has to diagnose from scratch.
          #
          # Anchored on the `from "…"` clause rather than on the bare string,
          # because this repository documents its defects at the site it removed
          # them and a raw-text scan misfires worst where the code is cleanest.
          # A comment reading "see helpers/stripe for why" would otherwise hold
          # an innocent spec out of the proof — and unlike a scanner that
          # over-reports, this one over-EXCLUDES, which is the silent direction.
          mapfile -t EXCLUDED < <(
            grep -rlE 'from "[^"]*helpers/stripe"' e2e --include='*.spec.ts' \
              | sed 's#^e2e/##' | sort
          )
          mapfile -t ALL_SPECS < <(find e2e -name '*.spec.ts' | sed 's#^e2e/##' | sort)

          if [ "${#EXCLUDED[@]}" -eq 0 ]; then
            echo "::error::No spec imports e2e/helpers/stripe. Either the helper moved or this selector broke — either way the exclusion this job depends on has silently become a no-op, and the dispatch would red on an expired certificate all over again." >&2
            exit 1
          fi
          if [ "$(( ${#EXCLUDED[@]} * 4 ))" -gt "${#ALL_SPECS[@]}" ]; then
            echo "::error::${#EXCLUDED[@]} of ${#ALL_SPECS[@]} spec files would be held out — over a quarter of the suite. A proof narrowed that far is not worth reporting; find out what changed before dispatching again." >&2
            exit 1
          fi

          printf 'Holding out %d of %d spec file(s) — they drive the app into a live TLS call this clock cannot complete:\n' \
            "${#EXCLUDED[@]}" "${#ALL_SPECS[@]}"
          printf '  - %s\n' "${EXCLUDED[@]}"

          # Read by playwright.config.ts, which has the note on why this cannot
          # be a command-line file filter.
          printf 'E2E_EXCLUDE_SPECS=%s\n' "$(IFS=,; printf '%s' "${EXCLUDED[*]}")" >> "$GITHUB_ENV"

          ARGS_FILE="$RUNNER_TEMP/rollover-run-args.txt"
          : > "$ARGS_FILE"
          # How many spec files this run is entitled to contain BEFORE the
          # live-provider exclusion is applied. The step below holds Playwright
          # to it, which is what catches a narrowing that came from somewhere
          # other than this job — a stray `testIgnore`, a project that stopped
          # being enabled, a spec that no longer parses.
          RUNNABLE=0
          if [ "$RUN_SCOPE" = 'date-bearing' ]; then
            # Derived from the imports too, and for the same reason.
            mapfile -t SPECS < <(grep -rlE \
              'relDateOnly|stayWindow|walkCalendarToMonth|calendarDayLabel|lodgeNightLabel|DEMO_BOOKING_WINDOWS' \
              e2e --include='*.spec.ts' | sort)
            if [ "${#SPECS[@]}" -eq 0 ]; then
              echo "::error::No date-bearing specs matched — that is a broken selector, not a clean run." >&2
              exit 1
            fi
            # The multi-lodge project is only in the config when
            # E2E_MULTI_LODGE=1, which this job never sets. Naming those specs
            # anyway is not an error — Playwright simply matches nothing — but
            # it would print a spec list two entries longer than the run, which
            # is the same quiet narrowing this whole step exists to refuse.
            KEPT=()
            for spec in "${SPECS[@]}"; do
              case "$spec" in
                e2e/multi-lodge/*)
                  printf 'Not naming %s: it belongs to the multi-lodge project, which this job does not enable.\n' "$spec"
                  ;;
                *) KEPT+=("$spec") ;;
              esac
            done
            if [ "${#KEPT[@]}" -eq 0 ]; then
              echo "::error::Every date-bearing spec lives in a project this job does not enable, so this scope has nothing to run." >&2
              exit 1
            fi
            # The live-provider specs stay ON this list deliberately. One
            # mechanism does the excluding — `testIgnore` in
            # playwright.config.ts — so the step below can prove it took by
            # listing the same run with and without it. Subtracting them here
            # as well would make that comparison compare nothing.
            printf 'Scope is date-bearing: naming %d spec(s), less the %d held out above.\n' \
              "${#KEPT[@]}" "${#EXCLUDED[@]}"
            printf '  %s\n' "${KEPT[@]}"
            printf '%s\n' "${KEPT[@]}" > "$ARGS_FILE"
            RUNNABLE="${#KEPT[@]}"
          else
            echo 'Running the whole suite, less the spec(s) held out above.'
            for spec in "${ALL_SPECS[@]}"; do
              case "$spec" in
                multi-lodge/*) ;;
                *) RUNNABLE=$(( RUNNABLE + 1 )) ;;
              esac
            done
          fi
          printf 'ARGS_FILE=%s\n' "$ARGS_FILE" >> "$GITHUB_ENV"
          # The +1 is e2e/auth.setup.ts: the `setup` project is a DEPENDENCY, so
          # Playwright contributes it in full whatever the file filter says. If a
          # second setup file is ever added this fails loudly with both numbers,
          # which is the right direction for an assumption to break in.
          printf 'EXPECTED_BASELINE_FILES=%d\n' "$(( RUNNABLE + 1 ))" >> "$GITHUB_ENV"

      # A run that narrowed further than it said would report green while
      # proving very little — the same vacuous pass the clock check below
      # exists to refuse. So prove the narrowing rather than trusting it: list
      # the tests once WITHOUT the exclusion and once WITH it, and require the
      # difference to be exactly the files that were named. Listing loads the
      # config and walks the test directory; it starts no browser and touches
      # no network, so it is safe on either side of the shift and cheap.
      - name: Prove the exclusion took, and took exactly what it named
        run: |
          set -euo pipefail
          mapfile -t ARGS < <(cat "$ARGS_FILE")
          IFS=',' read -r -a EXCLUDED <<< "$E2E_EXCLUDE_SPECS"

          BASELINE="$RUNNER_TEMP/rollover-list-baseline.txt"
          SELECTED="$RUNNER_TEMP/rollover-list-selected.txt"
          # Playwright prints a native separator; normalise so the check reads
          # the same on any host.
          E2E_EXCLUDE_SPECS='' npx playwright test --list --reporter=list "${ARGS[@]}" \
            | tr '\\' '/' > "$BASELINE"
          npx playwright test --list --reporter=list "${ARGS[@]}" \
            | tr '\\' '/' > "$SELECTED"
          tail -n 1 "$BASELINE"
          tail -n 1 "$SELECTED"

          count_files() {
            sed -n 's/^Total: [0-9]* tests* in \([0-9]*\) files*$/\1/p' "$1" | tail -n 1
          }
          BASE_FILES="$(count_files "$BASELINE")"
          SEL_FILES="$(count_files "$SELECTED")"
          if [ -z "$BASE_FILES" ] || [ -z "$SEL_FILES" ]; then
            echo "::error::Could not read a file count out of Playwright's listing, so this job cannot show what it is about to leave out. Refusing to run a proof it cannot describe." >&2
            exit 1
          fi

          # First: is the run the size it should be before this job narrows it at
          # all? Comparing the two listings alone cannot answer that — a spec
          # dropped by something OTHER than E2E_EXCLUDE_SPECS is missing from
          # both sides equally, and the difference still comes out right.
          if [ "$BASE_FILES" -ne "$EXPECTED_BASELINE_FILES" ]; then
            echo "::error::Playwright selected ${BASE_FILES} file(s) before any exclusion, and this scope accounts for ${EXPECTED_BASELINE_FILES}. Something is narrowing the run that this job did not ask for, so a green from it would cover less than it claims." >&2
            exit 1
          fi

          EXPECTED=0
          for spec in "${EXCLUDED[@]}"; do
            if grep -qF " ${spec}:" "$BASELINE"; then
              EXPECTED=$(( EXPECTED + 1 ))
            fi
            if grep -qF " ${spec}:" "$SELECTED"; then
              echo "::error::${spec} is still selected. The exclusion never reached Playwright, and this dispatch would red on an expired certificate rather than on a date." >&2
              exit 1
            fi
          done

          if [ "$EXPECTED" -eq 0 ]; then
            echo "::error::None of the excluded specs was in this run to begin with, so excluding them proves nothing about it. Check the scope and the selector." >&2
            exit 1
          fi
          # There is deliberately no "and at least N files remain" check here.
          # Every way of reaching one was tried against the real config, and each
          # is already refused above or by Playwright itself: narrowing the run
          # to nothing leaves `chromium` empty, which drops the `setup` project
          # with it and makes Playwright exit "No tests found"; anything short of
          # that trips the two checks above first. A guard nothing can trip reads
          # as protection without being any.
          if [ "$(( BASE_FILES - SEL_FILES ))" -ne "$EXPECTED" ]; then
            echo "::error::Holding out ${EXPECTED} spec(s) removed $(( BASE_FILES - SEL_FILES )) file(s) from the run (${BASE_FILES} -> ${SEL_FILES}). Something other than the live-provider specs has been narrowed away, and a green from this run would not mean what it says." >&2
            exit 1
          fi
          printf 'Verified: %d spec file(s) held out, %s file(s) still in the run.\n' "$EXPECTED" "$SEL_FILES"

      - name: Write staging env file
        run: bash scripts/ci/write-e2e-staging-env.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: tacbookings-e2e-app:ci
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=
            RELEASE_ID=${{ github.sha }}
          cache-from: |
            type=gha,scope=alpineclubbookingsnz-app
            type=gha,scope=alpineclubbookingsnz-e2e
          cache-to: type=gha,mode=max,scope=alpineclubbookingsnz-e2e

      # Pull the stack's other images now, while the clock is still real, so no
      # registry round trip happens after the shift.
      - name: Pre-pull stack images
        run: |
          docker compose --env-file .env.staging -p tacbookings-staging \
            -f docker-compose.yml -f docker-compose.staging.yml \
            pull postgres mailpit

      # ---------------------------------------------------------------------
      # The clock moves here, and nothing between this line and "Restore the
      # runner's clock" reaches the network — that is what the pre-pull above
      # and the early restore below are both for.
      #
      # "Nothing" has to include what the APP does while a spec drives it, and
      # for the first two months of this job's life it did not: the runner's own
      # network work was accounted for and the container's was not, so a spec
      # that made the app call Stripe met an expired certificate and the job
      # reported failure for a reason that had nothing to do with a date
      # (#3227). The step "Work out which specs this clock can honestly run"
      # above is the other half of this promise.
      # ---------------------------------------------------------------------
      - name: Park the runner's clock in the rollover window
        id: shift
        # The dispatch input reaches the script through the ENVIRONMENT, never
        # through `${{ }}` interpolation into the shell text. Interpolation
        # splices an attacker-chosen string into the script before bash parses
        # it, which is a script-injection hole even on a dispatch-only workflow;
        # an env var is data.
        env:
          # Empty on every `schedule` event, because the `inputs` context is only
          # populated for a dispatch. That is the intended path, not an oversight:
          # a scheduled run takes the computed month-end below, which is the shape
          # that fired. Only a person choosing an instant by hand sets this.
          REQUESTED_INSTANT: ${{ inputs.instant }}
        run: |
          set -euo pipefail
          REQUESTED="$REQUESTED_INSTANT"
          if [ -n "$REQUESTED" ]; then
            TARGET="$REQUESTED"
          else
            # The last day of the current UTC month at 14:30Z — the shape that
            # fired on 2026-08-31. If that instant has already passed, take next
            # month's, so a dispatch late on the 31st still proves something.
            MONTH_END="$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%Y-%m-%d)"
            TARGET="${MONTH_END}T14:30:00Z"
            if [ "$(date -u -d "$TARGET" +%s)" -le "$(date -u +%s)" ]; then
              MONTH_END="$(date -u -d "$(date -u +%Y-%m-01) +2 month -1 day" +%Y-%m-%d)"
              TARGET="${MONTH_END}T14:30:00Z"
            fi
          fi
          echo "Parking the runner at $TARGET (was $(date -u --iso-8601=seconds))"
          sudo timedatectl set-ntp false || true
          sudo systemctl stop systemd-timesyncd || true
          sudo date -u -s "$TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      # A proof whose clock shift silently failed would report green while
      # proving nothing — the same vacuous pass the unit canary guards against.
      # Two things have to be true, and neither is implied by the step above
      # exiting 0: the shift reached Node's `Date`, and it landed somewhere that
      # actually exercises the hazard. If the runner's UTC month and the club's
      # month agree, this run cannot tell a club-derived date from a
      # runner-derived one, and saying so is the honest outcome.
      - name: Prove the shift reaches Node, and that it means something
        run: |
          set -euo pipefail
          node -e '
            const now = new Date();
            const club = new Intl.DateTimeFormat("en-CA", {
              timeZone: process.env.CLUB_TIME_ZONE,
              year: "numeric", month: "2-digit", day: "2-digit",
            }).format(now);
            const runner = now.toISOString().slice(0, 10);
            console.log(`runner day ${runner}, club day ${club}`);
            if (runner === club) {
              console.error(
                "The runner and the club are on the SAME day, so this run cannot " +
                "distinguish a club-derived date from a runner-derived one. " +
                "Refusing to report a meaningless pass — dispatch again with an " +
                "instant between 12:00 and 24:00 UTC.",
              );
              process.exit(1);
            }
            if (runner.slice(0, 7) === club.slice(0, 7)) {
              console.error(
                "The runner and the club are on the same MONTH. That is a weaker " +
                "run than the one that failed: the calendar walk crossing a month " +
                "boundary is the case at issue. Dispatch with the last day of a " +
                "month at 14:30Z.",
              );
              process.exit(1);
            }
          '

      - name: Prepare staging stack (postgres, migrate, seed, app)
        run: E2E_SKIP_APP_BUILD=1 bash scripts/e2e-stack.sh prepare

      # Which specs run, and which are held out, was settled and PROVED before
      # the clock moved. `E2E_EXCLUDE_SPECS` is already in this step's
      # environment and reaches playwright.config.ts through the stack script.
      - name: Run the browser suite under the shifted clock
        run: |
          set -euo pipefail
          mapfile -t ARGS < <(cat "$ARGS_FILE")
          if [ "${#ARGS[@]}" -eq 0 ]; then
            bash scripts/e2e-stack.sh run
          else
            bash scripts/e2e-stack.sh run "${ARGS[@]}"
          fi

      # ---------------------------------------------------------------------
      # The clock goes back HERE, before anything touches the network again.
      # Everything below this line uploads an artifact, talks to the Actions
      # service or writes a summary, and all of that is TLS: a runner a month
      # ahead can fail a handshake against a certificate that has not been
      # issued yet in its own reckoning, and the job then reds for a reason that
      # has nothing to do with the suite. The proof is already recorded by the
      # step above, so nothing is lost by restoring first.
      #
      # `always()`, and it is the pair of the shift: if the suite fails, the
      # report upload below is exactly what a reader needs, so it must not fail
      # too.
      # ---------------------------------------------------------------------
      - name: Restore the runner's clock
        if: always()
        run: |
          sudo timedatectl set-ntp true || true
          sudo systemctl start systemd-timesyncd || true
          date -u --iso-8601=seconds

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-rollover-proof-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore

      # Both of these presuppose a stack. The selection and proof steps run
      # BEFORE the env file is written, so a failure there reaches here with no
      # `.env.staging` and no containers: teardown then exits 1 on
      # "Missing .env.staging", turning one clean, well-explained failure into
      # two and burying the real one. The condition is on the STEP body rather
      # than a job-level `if:`, which on a required check would report a
      # vacuous pass — see the header of `ci.yml`. This job is not required, but
      # the habit is worth keeping.
      - name: Show app logs on failure
        if: failure()
        run: |
          if [ ! -f .env.staging ]; then
            echo "No .env.staging, so no stack was ever started — the failure above is from before the stack existed."
            exit 0
          fi
          docker compose --env-file .env.staging -p tacbookings-staging \
            -f docker-compose.yml -f docker-compose.staging.yml logs app | tail -200

      - name: Tear down stack
        if: always()
        run: |
          if [ ! -f .env.staging ]; then
            echo "No .env.staging, so there is no stack to tear down."
            exit 0
          fi
          bash scripts/e2e-stack.sh down

      - name: Explain the verdict
        if: always()
        # Through the ENVIRONMENT, for the reason the shift step gives: `target`
        # carries the dispatcher's own `instant` input, and `${{ }}` splices it
        # into the script text before bash parses it. Guarding one step against
        # that and not the other leaves the hole open.
        env:
          PARKED_AT: ${{ steps.shift.outputs.target }}
        run: |
          {
            echo "## E2E rollover proof — ${PARKED_AT:-(clock never moved)}"
            echo
            echo "The runner's clock was parked at \`${PARKED_AT:-nowhere: the shift step did not complete}\`,"
            echo "so the whole stack — Playwright, the seed and the app container —"
            echo "ran with New Zealand already in the following month."
            echo
            echo "A failure here means a browser spec is deriving a calendar date"
            echo "from the machine rather than from the club. The rule, and the three"
            echo "guards that run on every pull request, are in"
            echo "\`docs/TESTING.md\` → \"The browser suite's clock discipline\"."
            echo
            if [ -n "${E2E_EXCLUDE_SPECS:-}" ]; then
              echo "### Held out of this run"
              echo
              echo "These specs drive the app into a live TLS call, which no clock this"
              echo "far forward can complete, so they were excluded rather than left to"
              echo "fail on an expired certificate. The list is derived from which specs"
              echo "import \`e2e/helpers/stripe\`, so it cannot go stale:"
              echo
              printf '%s\n' "$E2E_EXCLUDE_SPECS" | tr ',' '\n' | sed 's/^/- `/; s/$/`/'
            else
              echo "Nothing was held out of this run — which is itself unexpected, since"
              echo "the live-provider exclusion should always name at least one spec."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
