name: E2E

# Playwright browser E2E suite for the Critical journeys in
# docs/END_TO_END_TEST_MATRIX.md, run against the staging compose stack with
# the base + demo seeds. This is a blocking gate: a red run fails the workflow
# (promoted from advisory in #1315 after a stable green window on main).
#
# The Stripe payment specs skip unless the STRIPE_TEST_SECRET_KEY and
# STRIPE_TEST_PUBLISHABLE_KEY repository secrets hold genuine Stripe
# *test-mode* keys (sk_test_… / pk_test_…). Never store live keys there.

on:
  # `epic/**` is here for the integration-branch model (#3002): an epic's
  # children target `epic/<issue>-<slug>` rather than `main`, so without this
  # they would get no CI at all and the only substitute was a throwaway probe
  # pull request against `main` — which tests the commit OUTSIDE its stack and
  # so can pass while the stacked integration is broken. `push` is included as
  # well so the integration branch is re-checked after each child merges into
  # it, rather than surfacing breakage at the epic's final merge.
  #
  # This widens WHEN the existing jobs run and adds no new status context, so
  # `main`'s branch protection is untouched. See
  # docs/agents/ISSUE_WORKFLOW.md -> "An epic reaches `main` as ONE merge".
  pull_request:
    branches:
      - main
      - "epic/**"
  push:
    branches:
      - main
      - "epic/**"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs only on pull requests (a new push to the same PR
  # supersedes the previous run). Pushes to main must NOT cancel each other:
  # every merge needs its own browser verdict, so main-push runs queue and each
  # completes instead of being voided (finding F13 / #1373 — cancel-in-progress
  # previously voided most main-push E2E runs).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      APP_IMAGE: tacbookings-e2e-app:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately BEFORE the image build and the stack prepare. The browser
      # is a prerequisite of the run step, and finding it broken after ten
      # minutes of building the app image wastes that whole build. Cached, so
      # the common case is seconds. See the action for the measurement.
      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers

      # One home for the stack's env file (INV-SSOT): this job, the
      # multi-lodge job below and `e2e-rollover-proof.yml` all need the
      # identical file, and it used to be a copied heredoc per job.
      - name: Write staging env file
        run: bash scripts/ci/write-e2e-staging-env.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Build the app image once with the same cache scope the publish job
      # uses, so E2E runs reuse main's layers instead of rebuilding Next.js.
      - name: Build app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: tacbookings-e2e-app:ci
          # RELEASE_ID (#2352 D1) gives the staging stack a real per-release CSP
          # nonce, so the static-CMS spec asserts the same nonce on two requests
          # rather than passing on the per-process fallback. Stated here rather
          # than inside the block below: every line of that block is passed to
          # the builder verbatim, so a `#` comment there becomes a build arg.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=
            RELEASE_ID=${{ github.sha }}
          cache-from: |
            type=gha,scope=alpineclubbookingsnz-app
            type=gha,scope=alpineclubbookingsnz-e2e
          cache-to: type=gha,mode=max,scope=alpineclubbookingsnz-e2e

      - name: Prepare staging stack (postgres, migrate, seed, app)
        run: E2E_SKIP_APP_BUILD=1 bash scripts/e2e-stack.sh prepare

      - name: Run Playwright suite
        run: bash scripts/e2e-stack.sh run

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Show app logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.staging -p tacbookings-staging \
            -f docker-compose.yml -f docker-compose.staging.yml logs app | tail -200

      - name: Tear down stack
        if: always()
        run: bash scripts/e2e-stack.sh down

  # Blocking two-lodge coverage — issue #1568, promoted advisory→blocking in
  # #1655 (precedent: #1315) after the observation window: the one observed
  # flake class was root-caused and fixed test-side in #1650. Runs the small
  # `multi-lodge` Playwright project against a stack seeded with a SECOND
  # active lodge (E2E_MULTI_LODGE=1 → e2e/setup/seed-second-lodge.ts). It stays
  # a separate job so the second-lodge seed never reaches the single-lodge
  # stack the `playwright` job's specs assert on. Its name is one of branch
  # protection's required status checks — a red run blocks (non-admin) merges.
  multi-lodge:
    name: E2E multi-lodge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      APP_IMAGE: tacbookings-e2e-app:ci
      # Provisions lodge B in prepare and adds the `multi-lodge` project to the
      # Playwright config for the run step.
      E2E_MULTI_LODGE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately BEFORE the image build and the stack prepare. The browser
      # is a prerequisite of the run step, and finding it broken after ten
      # minutes of building the app image wastes that whole build. Cached, so
      # the common case is seconds. See the action for the measurement.
      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers

      # One home for the stack's env file (INV-SSOT): this job, the
      # multi-lodge job below and `e2e-rollover-proof.yml` all need the
      # identical file, and it used to be a copied heredoc per job.
      - name: Write staging env file
        run: bash scripts/ci/write-e2e-staging-env.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: tacbookings-e2e-app:ci
          # RELEASE_ID (#2352 D1) gives the staging stack a real per-release CSP
          # nonce, so the static-CMS spec asserts the same nonce on two requests
          # rather than passing on the per-process fallback. Stated here rather
          # than inside the block below: every line of that block is passed to
          # the builder verbatim, so a `#` comment there becomes a build arg.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=
            RELEASE_ID=${{ github.sha }}
          cache-from: |
            type=gha,scope=alpineclubbookingsnz-app
            type=gha,scope=alpineclubbookingsnz-e2e
          cache-to: type=gha,mode=max,scope=alpineclubbookingsnz-e2e

      - name: Prepare staging stack with a second lodge
        run: E2E_SKIP_APP_BUILD=1 bash scripts/e2e-stack.sh prepare

      - name: Run multi-lodge Playwright project
        run: bash scripts/e2e-stack.sh run --project=multi-lodge

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-multi-lodge-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Show app logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.staging -p tacbookings-staging \
            -f docker-compose.yml -f docker-compose.staging.yml logs app | tail -200

      - name: Tear down stack
        if: always()
        run: bash scripts/e2e-stack.sh down
