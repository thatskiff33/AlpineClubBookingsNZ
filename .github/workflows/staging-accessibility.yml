name: Staging Accessibility Verification

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Temporary staging URL override. Leave blank to use the staging environment variable."
        required: false
        type: string
      paths:
        description: "Comma-separated paths to check. Leave blank to use defaults."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-accessibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lighthouse:
    name: Lighthouse accessibility baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ inputs.base_url || vars.STAGING_APP_URL }}
    env:
      STAGING_APP_URL: ${{ inputs.base_url || vars.STAGING_APP_URL }}
      STAGING_A11Y_PATHS: ${{ inputs.paths || vars.STAGING_A11Y_PATHS || '/,/login,/register,/forgot-password,/faq,/contact' }}
      STAGING_A11Y_OUT_DIR: reports/lighthouse/staging
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pnpm version comes from `packageManager` in package.json (#3673).
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run staging Lighthouse checks
        run: pnpm run review:staging:a11y

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-lighthouse-${{ github.run_id }}
          path: reports/lighthouse/staging/
          if-no-files-found: error
