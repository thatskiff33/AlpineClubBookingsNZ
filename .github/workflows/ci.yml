name: CI

# Residual risk accepted for the `npm audit --audit-level=high` gate, which
# lives in the `dependency-audit` job below (#2946), not in `verify`:
# - `next-auth@5.0.0-beta.31` / `@auth/core@0.41.2` still declare an optional
#   `nodemailer@^7.0.7` peer while this repo validates `nodemailer@8.0.6`.
# - `package.json` carries a scoped `overrides["next-auth"].nodemailer` entry
#   pinned to this repo's own `nodemailer` until Auth.js expands that optional
#   peer range. (An earlier version of this note said an `.npmrc` pinned
#   `legacy-peer-deps=true`; that file was deleted long ago and the scoped
#   override is what does the work now.) See `docs/MAINTENANCE.md` for the
#   public maintenance baseline.

on:
  # `epic/**` is here for the integration-branch model (#3002): an epic's
  # children target `epic/<issue>-<slug>` rather than `main`, so without this
  # they would get no CI at all and the only substitute was a throwaway probe
  # pull request against `main` — which tests the commit OUTSIDE its stack and
  # so can pass while the stacked integration is broken. `push` is included as
  # well so the integration branch is re-checked after each child merges into
  # it, rather than surfacing breakage at the epic's final merge.
  #
  # This widens WHEN the existing jobs run and adds no new status context, so
  # `main`'s branch protection is untouched. See
  # docs/agents/ISSUE_WORKFLOW.md -> "An epic reaches `main` as ONE merge".
  pull_request:
    branches:
      - main
      - "epic/**"
  push:
    branches:
      - main
      - "epic/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Audit dependency graph
        run: npm audit --audit-level=high --package-lock-only

  # #2946: THE DEPENDENCY AUDIT IS A JOB OF ITS OWN, AND IT MUST STAY ONE.
  #
  # It used to be a step near the front of `verify`. On 17 August a high-severity
  # advisory was published for a package this repository reaches only through
  # `prisma` (#2945) — nobody here changed anything. The step failed, and because
  # Actions skips every LATER step in a job once one fails, `verify` stopped
  # running lint, the file-size ratchet, `prisma generate`, typecheck, knip,
  # `npm test` and the build, on every branch, while the other required checks
  # stayed green. A pull request in that window read as "one unrelated dependency
  # thing is red, everything else passed"; in fact the suite had not run at all.
  # When #2947 restored the gate, the very first real run of the suite failed
  # immediately on a defect (#2944) that had accumulated behind it unnoticed.
  #
  # So do not fold this back into `verify`, and do not give it a `needs:`. A
  # dependent job SKIPS when its upstream fails, and GitHub counts a skipped
  # required check as SATISFYING branch protection — which turns the merge button
  # on. For the same reason there is no job-level `if:` here: any condition
  # belongs on a STEP, where a skip still leaves the job a real pass or a real
  # failure. See AGENTS.md -> "Completion and Merge".
  #
  # The audit stays BLOCKING (owner decision, 19 Aug 2026, on #2946). A new
  # advisory is a supply-chain decision a human should make — upgrade, override
  # or accept — not a report nobody reads.
  #
  # There is deliberately no `npm ci` here. Measured on npm 11.16.0 / Node 24:
  # `npm audit --audit-level=high` builds its tree from `package-lock.json` and
  # returns the same verdict with and without `node_modules` present — exit 0 on
  # this lock either way, exit 1 either way with the deepmerge-ts advisory planted
  # back into the lock. The command is unchanged from the one `verify` ran, and
  # skipping the install keeps this gate from reddening for anything except an
  # advisory, which is the entire point of separating it.
  #
  # This does NOT duplicate the `dependency-review` job above, and neither
  # replaces the other. That one is pull-request-only — it carries a job-level
  # `if:`, which is exactly why it can never be a required check — and it is
  # advisory. This one is required and also runs on pushes to `main`.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # No `cache: npm`: nothing here installs, so there is no npm cache to hit.
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Audit dependencies
        run: npm audit --audit-level=high

  static-analysis:
    name: Static analysis gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload Semgrep SARIF to GitHub code scanning
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.161.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # #2686: the repository's own rules in `.semgrep/rules/` carry must-fail
      # and must-pass fixtures in `.semgrep/tests/`, and this runs them. It costs
      # seconds and it is the only thing that notices a custom rule which has
      # quietly stopped matching — a rule that matches nothing still scans clean,
      # which reads exactly like a rule that found nothing.
      - name: Test the repository's own Semgrep rules against their fixtures
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -w /src \
            "${SEMGREP_IMAGE}" \
            semgrep --test --config .semgrep/rules .semgrep/tests --metrics=off

      # The repository's own rules run in the SAME blocking scan as the registry
      # packs, and the packs stay: `p/nextjs`, `p/typescript`, `p/javascript` and
      # `p/react` are what cover the generic classes, and `.semgrep/rules` covers
      # only the two boundaries no registry pack can know about (#2686).
      # `.semgrep/tests` is excluded because every file in it is a deliberate
      # violation.
      - name: Run Semgrep static analysis
        run: |
          mkdir -p "$RUNNER_TEMP/semgrep-output"
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/semgrep-output:/out" \
            -w /src \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config .semgrep/rules \
              --config p/nextjs \
              --config p/typescript \
              --config p/javascript \
              --config p/react \
              --error \
              --metrics=off \
              --exclude node_modules \
              --exclude .next \
              --exclude .semgrep/tests \
              --sarif-output /out/semgrep-results.sarif

      # The RAW scan output, suppressed results included. This is the audit
      # record, and it is what the #2841 triage measured the `suppressions`
      # field from — so it must stay unfiltered.
      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/semgrep-output/semgrep-results.sarif
          if-no-files-found: ignore

      # No `cache: npm`: the filter step below uses only Node's own modules, so
      # nothing installs and there is no npm cache to hit.
      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # #2841. Semgrep honours a `nosemgrep` comment and marks the result
      # `"suppressions": [{"kind": "inSource"}]`, which is why the blocking scan
      # above passes with two justified raw-SQL exemptions in the tree. GitHub's
      # SARIF ingest does not act on that field, so those two were filed as
      # code-scanning alerts that can never be closed and reappear on every scan.
      # `INV-OPS-014`'s own failure message tells contributors to add such a
      # comment, so every justified exemption minted another permanent alert — and
      # a genuinely dangerous new raw-SQL call would have arrived in that list
      # looking identical to the known-safe ones.
      #
      # This cannot weaken the gate: `semgrep scan --error` above already ran on
      # the unfiltered results and has already passed or failed, and the raw SARIF
      # is uploaded as the artifact directly above. Only what reaches the Security
      # tab changes. Delete a `nosemgrep` comment and Semgrep reports the result
      # unsuppressed again, so the alert comes back.
      - name: Drop already-suppressed results before publishing alerts
        if: always()
        run: |
          node scripts/ci/filter-suppressed-sarif.mjs \
            "$RUNNER_TEMP/semgrep-output/semgrep-results.sarif" \
            "$RUNNER_TEMP/semgrep-output/semgrep-results.published.sarif"

      # Surface findings as GitHub code scanning alerts (Security tab) without
      # any Semgrep Cloud dependency. Runs even when the scan step failed the
      # gate on findings so the alerts still publish.
      - name: Upload Semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/semgrep-output/semgrep-results.published.sarif
          category: semgrep

  # #2686: ONE required secret-scanning gate, replacing the two jobs that used to
  # sit here (`gitleaks-full-repo` and `gitleaks-pr-diff`). Three things were
  # wrong with that pair and all three mattered once this became a required
  # check:
  #
  # 1. `gitleaks-full-repo` did not scan the full repository. It used
  #    `gitleaks/gitleaks-action`, which picks its scan range from the EVENT:
  #    `--log-opts=--no-merges --first-parent <base>^..<head>` on both `push` and
  #    `pull_request`, and scans everything only on `workflow_dispatch` and
  #    `schedule`, neither of which this workflow fires. Its measured runtime of
  #    11–13 seconds was the tell; a real history scan of this repository takes
  #    about 75 seconds. So the two jobs were scanning the same commits twice —
  #    and nothing has ever scanned the history.
  # 2. They ran DIFFERENT gitleaks versions over those same commits: the action
  #    installs 8.24.3 by default, while the diff job pinned the 8.28.0
  #    container.
  # 3. Neither one could be reproduced locally, which is what a blocking gate
  #    most needs — you cannot fix what you cannot run. `SECURITY.md` now carries
  #    all three commands verbatim.
  #
  # The pinned container does all three scopes as STEPS of one job. The PR-range
  # step is step-level conditional, never job-level, and the reason is the
  # OPPOSITE of the one an earlier draft of this comment gave. It is not that a
  # skipped job produces no status — measured on this repository at 66448740c,
  # `dependency-review` and `gitleaks-pr-diff` both skipped via a JOB-level `if:`
  # and both reported a status; only a WORKFLOW-level `on:` filter produces no
  # status at all. The real hazard is worse: GitHub counts a `skipped` required
  # check as SATISFYING branch protection. A job-level `if:` on a required
  # security gate therefore makes it vacuously green — the gate reports "skipped"
  # and the merge button turns on. (This is also why removing `needs: verify`
  # from `docker-image-security` closed a hole rather than opening one: with it,
  # a pull request whose `verify` failed would have reported the required image
  # gate as skipped, i.e. as satisfied.) Keep every condition in this job at STEP
  # level, where a skip leaves the job — and so the required context — a real
  # pass or a real failure.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Pinned, and the same binary for all three scopes.
      # `deployment-image-contracts` pins this string too.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Two of the three scopes read history: the range scan needs the base
          # commit, and the history scan needs all of it.
          fetch-depth: 0

      # Proves the scanner can still fail before trusting it to pass. It builds
      # throwaway samples at run time — nothing is committed — and asserts that
      # a live-format credential and a connection-string password are BOTH
      # reported, that this repository's development connection strings are NOT,
      # and that a secret introduced while resolving a merge conflict is caught.
      # Without this, every silent-failure mode #2686 found (an empty rule set, a
      # shape allowlist that swallowed a whole rule, a scan that never looked at
      # merge commits) reads exactly like a clean repository.
      - name: Prove the secret scanner still fails on a planted secret
        run: bash scripts/ci/gitleaks-selftest.sh

      # Runs first of the real scans because it is the precise signal: a finding
      # here was introduced by THIS pull request, which is a different
      # conversation from a finding somewhere in five thousand commits of
      # history.
      #
      # The two SHAs go through `env:` rather than straight into the script.
      # `${{ }}` interpolated into a `run:` block is substituted before bash sees
      # it, so the value becomes part of the program — the GitHub Actions script
      # injection class that CodeQL's `actions` queries report. These two are
      # commit SHAs and are not attacker-controlled, but the safe shape costs
      # nothing and stops the pattern being copied to a field that is.
      #
      # `--diff-merges=first-parent` for the reason the history step below gives
      # at length: a pull request that merges `main` into itself to resolve a
      # conflict would otherwise have that resolution scanned by nothing.
      - name: Scan this pull request's own commits
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            "${GITLEAKS_IMAGE}" \
            git /repo \
            --log-opts="--diff-merges=first-parent ${PR_BASE_SHA}..${PR_HEAD_SHA}" \
            --exit-code=1 \
            --redact

      # The history scan is scoped to `main`, and the scope is resolved here so
      # a missing ref fails loudly instead of silently scanning nothing.
      #
      # It used to be `--log-opts=--all`, which was wrong in a way that only
      # bites once the check is REQUIRED. `actions/checkout` with
      # `fetch-depth: 0` materialises every branch as `refs/remotes/origin/*`,
      # and `git log --all` walks all of them — so ONE leak on anybody's
      # unrelated or abandoned branch turns this check red on every open pull
      # request and every push to `main`, and no author can fix it from their own
      # branch. Proven by injecting a commit onto a fake
      # `refs/remotes/origin/colleagues-branch`: the PR-range step exited 0 and
      # the `--all` step exited 1. The scope also moved whenever anyone pushed or
      # deleted a branch, and did not match the local reproduction command
      # `SECURITY.md` advertises. A repository-wide sweep is still worth having,
      # but it belongs in a scheduled non-blocking job where red is a task rather
      # than a merge freeze — see docs/MAINTENANCE.md.
      - name: Resolve the history scan scope
        run: |
          scope="$(git rev-parse --verify --quiet refs/remotes/origin/${GITHUB_BASE_REF:-main} || true)"
          if [ -z "$scope" ]; then
            scope="$(git rev-parse --verify --quiet refs/remotes/origin/main || true)"
          fi
          if [ -z "$scope" ]; then
            echo "::error::Cannot resolve the history scan scope. A required secret-scanning gate must never scan an empty range." >&2
            exit 1
          fi
          echo "HISTORY_SCAN_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "History scan scope resolved to $scope"

      # The scan the old job's name promised and never performed — and, since
      # the merge-commit fix below, the first one that has ever been able to see
      # a conflict resolution.
      #
      # `--diff-merges=first-parent` is load-bearing, not tidiness. gitleaks
      # drives `git log -p`, and `git log -p` emits NO PATCH for a merge commit,
      # so gitleaks silently skips every one of them. Measured on `main` at
      # c5194a325: 2,278 of 7,507 commits are merges, so the unflagged scan saw
      # only the other 5,229. On a repository whose house rule is "merge commits
      # only", that is thirty percent of history that has never been scanned —
      # and a secret written into a file WHILE RESOLVING A CONFLICT exists only
      # in the merge commit, so it was invisible. Proven with a four-commit
      # repository whose conflict resolution is a live-format Stripe key:
      # unflagged, "3 commits scanned … no leaks found", exit 0; flagged,
      # "4 commits scanned … leaks found: 1", exit 1. `--diff-merges=cc` does NOT
      # work — gitleaks cannot parse a combined diff.
      # `scripts/ci/gitleaks-selftest.sh` re-proves this every run.
      #
      # Measured cost of the flag on this repository's history: 5,101 commits /
      # 77.47 MB before, 7,335 commits / 333.65 MB after, which is 1.8x the wall
      # clock (184s -> 338s on the reference machine; ~75s -> ~140s expected on a
      # runner). It stays far inside the ~21m `Playwright E2E` gate, so it adds
      # nothing to time-to-merge.
      - name: Scan the history of main
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            "${GITLEAKS_IMAGE}" \
            git /repo \
            --log-opts="--diff-merges=first-parent ${HISTORY_SCAN_SCOPE}" \
            --exit-code=1 \
            --redact

      # Present-tense content, independent of commit topology. The two scans
      # above read PATCHES, so what they see depends on how history was shaped;
      # this one reads the checked-out FILES, so whatever is in the tree right
      # now is covered however it got there. It is also the only scope that
      # covers the pull request's merge PREVIEW — the tree `actions/checkout`
      # produces for a pull_request event is the merge of the head into the base,
      # which is not any commit either patch scan walks.
      #
      # Not redundant in practice: measured at 527eb74fc, the patch scans and the
      # tree scan report overlapping but DIFFERENT sets, because a rule that
      # needs surrounding context sees less in a diff hunk than in a whole file.
      # It costs about 10 seconds. Nothing installs dependencies in this job, so
      # there is no `node_modules` for it to walk.
      - name: Scan the checked-out tree
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            "${GITLEAKS_IMAGE}" \
            dir /repo \
            --exit-code=1 \
            --redact

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The concurrency-declaration gate fetches the CURRENT PR body from the
      # pulls API so a body edit can flip the check green on a plain re-run.
      pull-requests: read
    env:
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "false"
      CRON_SECRET: ci-cron-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tacbookings
      STRIPE_SECRET_KEY: sk_test_fake
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake
      XERO_ENABLE_DAILY_MEMBERSHIP_REFRESH: "false"
      XERO_ENABLE_LIVE_MEMBER_GROUP_LOOKUPS: "false"
      XERO_ENABLE_AUTOLOAD_XERO_CONTACT_GROUPS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Validate PR concurrency declaration
        if: github.event_name == 'pull_request'
        env:
          # Event-payload body is the fallback; the script prefers the live body
          # fetched from the pulls API so a post-failure body edit can go green
          # on a re-run without re-triggering the whole workflow.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-pr-concurrency-declaration.mjs

      # #2452: a code-bearing PR must carry its changelog entry as a
      # `changelog.d/` fragment (or declare that it needs none in the PR body).
      # Same live-body/event-body fallback as the gate above, so editing the PR
      # body and re-running is enough to go green.
      - name: Validate PR changelog entry
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/check-pr-changelog-fragment.mjs

      # #2909: every workflow job that runs the unit suite must check out full
      # git history, because part of that suite drives git against this
      # repository's own commits (HEAD^1, origin/main). The clock canary once ran
      # the suite on a depth-1 clone while this job checked out in full, so the
      # breakage passed all eight required checks, merged, and reddened `main`
      # (#2907) — the canary has no `pull_request` trigger and a developer's
      # clone has full history, so nothing else can see that divergence.
      #
      # Reads `.github/workflows/*.yml` and nothing else, so it sits here with
      # the other pre-install gates and fails in under a second. It stays ABOVE
      # the doc-index step deliberately: the #2691 contract test reads that step
      # as everything between its own name and `- name: Install dependencies`,
      # so a step inserted between the two breaks it.
      - name: Check workflows that run the suite check out full history
        run: node scripts/ci/check-workflow-suite-checkout-depth.mjs

      # #2691: every `docs/` page is reachable from a front door, and every cited
      # `INV-*` invariant id resolves to a real definition that the index lists.
      # Both properties are what make the routing table in AGENTS.md usable
      # instead of decorative, and neither is self-maintaining — the issue's own
      # watchpoint names the routing table as the part most likely to rot.
      # Needs nothing but git and Node, so it runs before `npm ci` and fails in
      # seconds rather than after the install.
      - name: Check doc index integrity (reachability + invariant ids)
        env:
          # Immutable event SHAs: a branch ref can move while a run is queued,
          # and HEAD^1 may already postdate a deletion in a multi-commit push.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: node scripts/ci/check-doc-index-integrity.mjs

      - name: Install dependencies
        run: npm ci

      # `Audit dependencies` used to sit here, between the install and the lint.
      # It is now the separate `dependency-audit` job above (#2946) — read the
      # comment there before moving it back. Nothing in this job may depend on
      # the audit's outcome.
      - name: Lint
        run: npm run lint

      # #2687: the file-size budgets in docs/MAINTENANCE.md, enforced as a
      # regression ratchet. Current debt may stay; new debt and debt growth may
      # not appear silently.
      #
      # #2979 removed the committed baseline this used to compare against. Each
      # changed file's previous length now comes from the base named below —
      # precisely, from the merge base of that ref and HEAD, so a branch is
      # judged on what IT did rather than on how far `main` has moved since.
      # (On a `pull_request` event those two are the same commit: the checkout
      # is `refs/pull/N/merge`, whose first parent IS the base tip.)
      #
      # THE BASE IS PASSED EXPLICITLY BECAUSE THE DEFAULT IS VACUOUS ON A PUSH.
      # This workflow runs on `push` to `main` as well as on pull requests, and
      # there `origin/main` is the very commit being tested: the merge base is
      # HEAD, the diff is empty, and the gate reports "0 production file(s)
      # changed" and exits 0 whatever the tree holds. That is not theoretical.
      # Two lanes that each add 60 lines to a 600-line file both pass their own
      # pull-request gate, merge cleanly to 720 against a 700 budget, and the
      # push gate says nothing — after which the NEXT pull request to touch the
      # file is judged against 720, so the debt is accepted permanently and in
      # silence. The push event's immutable pre-push SHA is the honest base, and
      # it is the same field `Check doc index integrity` uses above.
      #
      # Keyed on `github.event_name` deliberately: a `pull_request.synchronize`
      # payload ALSO carries a top-level `before`, and it is the previous PR
      # head. Using that would judge only the newest push to the branch and let
      # everything earlier in it through.
      #
      # A base the checkout cannot reach — an all-zero `before` from a
      # ref-creating push, or a commit orphaned by a force-push — FAILS in the
      # ratchet rather than passing with no evidence, the same way
      # `npm run pr:check` treats an unresolvable base.
      #
      # THAT IS WHY `github.event.created == false` IS IN THE EXPRESSION, and it
      # is not decoration. This comment used to say both cases were "blocked on
      # `main` by branch protection, so a red gate is the right answer if either
      # ever appears" — true while `push` only ever meant `main`. #3002 added
      # `push: branches: [epic/**]` above, and an epic branch is CREATED
      # routinely, once per epic. A ref-creating push carries
      # `before = 0000…`, the ratchet correctly refuses it, and `verify` would
      # be red on the first push of every epic branch — a gate failing on an
      # event that is entirely normal, which is how a gate gets ignored and then
      # deleted. On a creating push the branch is judged against `origin/main`
      # instead, which for a branch just cut from main is the same comparison a
      # pull request would make. The `Check migration safety ledger coverage`
      # step below carries the identical guard for the identical reason; keep
      # the two in step.
      #
      # `fetch-depth: 0` on this job's checkout is load-bearing for a quieter
      # reason than it used to say here: a shallow clone does NOT fail: it
      # resolves the ref, returns HEAD as the merge base, and reports OK over a
      # tree holding a 1300-line module. Truncated history narrows the diff
      # silently, which is worse than an error.
      #
      # Reads git and the working tree only — no network, no database, no
      # build — and runs in well under a second, so it sits here rather than
      # behind the slower gates.
      - name: File-size budget ratchet
        env:
          BUDGET_BASE: ${{ (github.event_name == 'push' && github.event.created == false) && github.event.before || 'origin/main' }}
        run: npm run quality:budget -- --base "$BUDGET_BASE"

      - name: Generate Prisma client
        run: npm run db:generate

      # Fails fast on type errors (app + test projects) before the slower
      # test suite and next build steps. tsc's heap crossed the Node default
      # (~4 GB) when the AID-6B pack landed (#2679) — the same run needs 8 GB
      # locally — so the ceiling is raised here rather than letting the gate
      # die of OOM (exit 134) instead of reporting type errors.
      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Blocking dead-code gate: fails the PR if any unused file, export, or
      # dependency is introduced. Config and carve-outs live in knip.jsonc.
      # Inherits the job-level DATABASE_URL so prisma.config.ts resolves.
      - name: Dead-code check (knip)
        run: npx knip

      - name: Test
        run: npm test

      # #2352: the public website's render modes are load-bearing and nothing else
      # notices when one changes — a route that quietly stops being per-request
      # gets prerendered at build with no database and no CSP nonce, and a route
      # that quietly starts being per-request just costs CPU. Source-only, so it
      # runs before the build rather than after it.
      - name: Check public website render modes
        run: node scripts/ci/check-website-render-modes.mjs

      - name: Build
        run: npm run build

      # Must run AFTER the build: production CSP is nonce-only and Next stamps
      # its nonce into inline bootstrap scripts only during DYNAMIC rendering,
      # so a statically prerendered route ships scripts the browser then blocks
      # (#2356). Only the real build output shows it, and the script fails loudly
      # if that output is missing rather than passing on an empty scan.
      - name: Check prerendered pages carry script nonces
        run: node scripts/ci/check-prerendered-script-nonces.mjs

      # Also after the build, and for the half the source check above cannot see
      # (#2352): whether Next AGREED. A component under (website) that reads
      # auth()/cookies()/headers() opts the CMS catch-all out of the full-route
      # cache silently — build green, tests green, and the only symptom is the CPU
      # cost coming back. The manifest is where the answer is written down.
      - name: Check the build's cached-route set
        run: node scripts/ci/check-website-prerender-manifest.mjs

  migration-drift:
    name: Migration drift check
    runs-on: ubuntu-latest
    # #2672 raised this from 15: this job also hosts every opt-in real-Postgres
    # lock harness, and the member-merge shared-double suite added below drives
    # ten real merge/writer interleavings whose own describe budget is 120s each.
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      concurrency-race-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concurrency_race_1881
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d concurrency_race_1881"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift_main
      # Prisma replays prisma/migrations into this shadow database to derive the
      # migration-history schema, then diffs it against schema.prisma. It must
      # already exist (Prisma 7 does not auto-create an explicit shadow DB).
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift_shadow
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # #3002: the ledger coverage check now also compares against a BASE REF
          # to find the migrations this change adds, and it refuses a shallow
          # clone rather than working from one. That refusal is deliberate and it
          # is the same trap the file-size ratchet records: on a depth-1 clone
          # `git merge-base` does not error, it hands back HEAD — so the
          # added-migration set would come back empty and the gate would pass
          # over the very pair it exists to catch.
          fetch-depth: 0

      # Fails fast (no database or npm install needed) if any migration matching
      # the blue/green hot-table/breaking regexes lacks a safety-ledger entry, if
      # a new migration reuses an existing timestamp prefix, or — since #3002 —
      # if a migration this change adds is a CONTRACT whose `previous_expand_release`
      # names an expand this change also adds. Catches finding F8 (#1359) at PR
      # time instead of at a fork's production deploy.
      #
      # THE BASE REF IS WHAT GIVES CHECK 4 ITS EPIC-WIDE REACH. On a pull request
      # the default `origin/main` is right in a way worth stating: for a child
      # targeting `epic/<n>`, the merge base of `origin/main` and that child's
      # head is the epic's BRANCH POINT, so the added set is the whole epic so far
      # plus this child — which means a child adding a contract for an expand an
      # EARLIER child added is caught at child-PR time rather than only at
      # `epic -> main`. On a push the event's `before` is the honest base, except
      # for a ref-CREATING push, whose `before` is all zeroes and which the gate
      # refuses; `github.event.created == false` is what keeps that off, and it
      # matters now that `epic/**` branches are created routinely.
      - name: Check migration safety ledger coverage
        env:
          MIGRATION_SAFETY_BASE: ${{ (github.event_name == 'push' && github.event.created == false) && github.event.before || 'origin/main' }}
        run: bash scripts/check-migration-safety-coverage.sh --base "$MIGRATION_SAFETY_BASE"

      # #2418: a data-REWRITING migration (backfill, repair, value transform)
      # must ship a verification fixture that the data-migration-verification
      # job executes against a real PostgreSQL. This gate is read-only and needs
      # no database, and it runs HERE as well as in that job on purpose:
      # migration-drift is a required status check, so a migration that rewrites
      # club data without a fixture cannot merge even before the new job is
      # added to branch protection.
      - name: Check data-migration verification coverage
        run: bash scripts/check-data-migration-verification.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create shadow database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE drift_shadow"

      - name: Generate Prisma client
        run: npm run db:generate

      # #1881: never let the opt-in real-Postgres lock harness silently skip in
      # CI. It uses a separate loopback-only service/database and the harness's
      # high-port + dedicated-name guard remains enforced.
      - name: Migrate dedicated advisory-lock race database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55442/concurrency_race_1881
        run: npx prisma migrate deploy

      - name: Test advisory-lock race protocol against dedicated PostgreSQL
        env:
          RUN_CONCURRENCY_RACE_TESTS: "1"
          CONCURRENCY_RACE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55442/concurrency_race_1881
        run: npx vitest run src/lib/__tests__/concurrency-lock-races.realdb.test.ts

      # #2672: the member-merge partner-share safety case is a set of claims
      # about PostgreSQL itself — that a widened lodge derivation really makes a
      # concurrent `adminShiftBookingDates` queue on merge's capacity key, and
      # that `BookingGuest.memberId`'s FK really fences a guest-row insert behind
      # merge's `Member … FOR UPDATE`. A mock can pin the SHAPE of those queries
      # and the EXISTENCE of the refusal; only this suite can pin the behaviour.
      # It self-skips without the env vars (same #1881 harness and database as
      # the step above), so it MUST stay wired or the whole proof silently
      # becomes a no-op — `review-findings-contracts.test.ts` fails if it goes
      # missing. Its describe carries a 120s per-test budget of its own, so no
      # --testTimeout override is needed here.
      - name: Test member-merge shared-double races against dedicated PostgreSQL
        env:
          RUN_CONCURRENCY_RACE_TESTS: "1"
          CONCURRENCY_RACE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55442/concurrency_race_1881
        run: npx vitest run src/lib/__tests__/member-merge-shared-double-races.realdb.test.ts

      # #2374 (AID-5): PROVE the dedicated SELECT-only AI Diagnostics database
      # role cannot write, cannot run DDL, cannot create a TEMP table, cannot read
      # the encrypted credential store, and is cancelled at its statement timeout.
      # ADR-007's claims are all claims about PostgreSQL's own behaviour, so a mock
      # cannot establish any of them. The suite provisions the role by running the
      # SHIPPED statements from `provision-role.ts` against the already-migrated
      # race database above, then connects AS that role. It gets its own step (and
      # its own vitest process) because it provisions/drops a cluster role and
      # revokes `TEMPORARY ... FROM PUBLIC` for the duration of its run. It
      # describe.skip's itself without the env vars, so this step MUST stay wired —
      # `review-findings-contracts.test.ts` fails if it goes missing.
      - name: Prove the SELECT-only diagnostics role against dedicated PostgreSQL
        env:
          RUN_CONCURRENCY_RACE_TESTS: "1"
          CONCURRENCY_RACE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55442/concurrency_race_1881
        run: npx vitest run src/lib/__tests__/ai-diagnostics-select-only-role.realdb.test.ts

      # E8 (#1934): real-Postgres behavior of the member-grouping cutover
      # migration (legacy-rule deactivation, shape-dedupe, backfill, mode seed,
      # idempotent re-run). Self-provisions a throwaway schema (needs PG 15+
      # for NULLS NOT DISTINCT); the suite describe.skip's itself when the env
      # var is absent, so this step MUST stay wired.
      - name: Test guarded Xero member-grouping migration against PostgreSQL
        env:
          XERO_MEMBER_GROUPING_MIGRATION_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx vitest run src/lib/__tests__/xero-member-grouping-migration.test.ts

      # #2269 / #2418: the email-override annotation strip writes an audit row
      # per changed row, and that half was pinned by string-matching the SQL
      # only — neutering the INSERT kept every assertion green. Same
      # disposable-schema pattern as the step above; the suite describe.skip's
      # itself when the env var is absent, so this step MUST stay wired.
      - name: Test email override annotation strip against PostgreSQL
        env:
          EMAIL_OVERRIDE_ANNOTATION_STRIP_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx vitest run src/lib/__tests__/email-message-annotation-strip.test.ts

      # #2430 (owner decision on PR #2466): the public Book Now default-off
      # migration also REWRITES DATA — it switches the button off for every
      # existing club, overriding saved choices — so the backfill is executed
      # here rather than only string-matched. Same disposable-schema pattern as
      # the steps above; the suite describe.skip's itself when the env var is
      # absent, so this step MUST stay wired.
      - name: Test the public Book Now default-off migration against PostgreSQL
        env:
          PUBLIC_BOOK_NOW_DEFAULT_OFF_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx vitest run src/lib/__tests__/public-book-now-default-off-migration.test.ts

      # F28 (#1888): wire the real-DB BookingGuest stay-range trigger suite so it
      # is no longer a silent no-op. It self-provisions a throwaway schema and
      # applies only the two trigger migrations, so it needs any reachable
      # Postgres. This step MUST stay wired — the suite describe.skip's itself
      # when the env var is absent, which is exactly how it went unrun before.
      - name: Test guarded BookingGuest stay-range triggers against PostgreSQL
        env:
          BOOKING_GUEST_RANGE_TRIGGER_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx vitest run src/lib/__tests__/booking-guest-range-triggers.test.ts

      # Fails (exit 2) if the committed migrations do not reproduce
      # schema.prisma — the parity gate enforced at deploy time. See issue #760.
      - name: Check migrations reproduce schema.prisma
        run: npm run db:check-drift

      # The drift check above cannot see raw-SQL partial indexes (Prisma cannot
      # express them), so apply the migrations for real and assert the partial
      # indexes match the committed manifest — a dropped/renamed index or an
      # undocumented new one fails here. See issue #1664.
      - name: Apply migrations to the drift database
        run: npx prisma migrate deploy

      - name: Check partial indexes match the manifest
        run: bash scripts/check-partial-indexes.sh

  # #2418: data-REWRITING migrations, executed against a real PostgreSQL holding
  # realistic pre-state.
  #
  # `migration-drift` above already applies every migration to a real database —
  # but to an EMPTY one, so a backfill/repair/transform matches no rows and is
  # proven only to parse. Every defect the three review rounds found in #2269's
  # migration was semantic, and none of them was reachable from empty tables.
  #
  # This job replays the migration chain up to each fixture's migration, seeds
  # the pre-state, runs the real migration.sql, asserts the rows, and then re-runs
  # each fixture against deliberately broken copies of that same migration to
  # prove the assertions have teeth. It is a separate job (owner decision on
  # #2418, 1 Aug 2026) rather than more steps on migration-drift so that a
  # failure reads as "a data migration does the wrong thing" instead of "schema
  # drift".
  #
  # The suite creates and drops its own throwaway DATABASE, so the service user
  # needs CREATEDB (the postgres superuser here). It MUST stay wired: the suite
  # fails inside this job when the URL is absent, rather than skipping quietly.
  data-migration-verification:
    name: Data migration verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: data_migration_verification
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests read DATABASE_URL through the app's env validation; it must parse
      # but is never connected to here — the suite uses the URL below instead.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55443/data_migration_verification
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Fail fast, before Node or a database is needed, when a data-rewriting
      # migration ships without a fixture (or a fixture is not registered).
      - name: Check data-migration verification coverage
        run: bash scripts/check-data-migration-verification.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify data migrations against PostgreSQL
        env:
          DATA_MIGRATION_VERIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55443/data_migration_verification
        run: npx vitest run src/lib/__tests__/data-migration-verification.realdb.test.ts

  # #2686: the CRITICAL half of this job is a REQUIRED status check, so the job
  # carries an explicit `name:` — the required context is
  # `Image security gate (Trivy CRITICAL)`, not the job id.
  #
  # `needs: verify` was removed here, deliberately. It existed to avoid paying
  # for a Docker build when the code was already known bad, but it also meant the
  # image scan could not start until `verify` finished — measured at 16m35s to
  # 17m49s on `main`, which put the whole job's completion at ~22 minutes and
  # would have made a REQUIRED image gate the new critical path. Unblocked, the
  # job finishes about 5m20s after the run starts (4m01s of that is the Docker
  # build), which is comfortably inside `Playwright E2E` at ~21m, so requiring it
  # adds nothing to time-to-merge. The price is a Docker build burned on pull
  # requests whose `verify` was going to fail anyway; the issue's own instruction
  # is not to weaken a selected control for time, and this recovers the time
  # instead of weakening anything.
  docker-image-security:
    name: Image security gate (Trivy CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Stripe publishable key is delivered at runtime from the DB store (#2082),
      # not a build arg — nothing Stripe is inlined into the image.
      NEXT_PUBLIC_SENTRY_DSN: ""
      IMAGE_REF: tacbookings-ci:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # AID-3 (#2372): inject the deployed commit SHA and observed-at as build
      # args so the in-builder knowledge-bundle generator can stamp a verified,
      # reproducible bundle (`.git` is absent from the build context).
      - name: Resolve knowledge-bundle build metadata
        run: |
          echo "GIT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KNOWLEDGE_BUNDLE_OBSERVED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${NEXT_PUBLIC_SENTRY_DSN}" \
            --build-arg GIT_COMMIT_SHA="${GIT_COMMIT_SHA}" \
            --build-arg KNOWLEDGE_BUNDLE_OBSERVED_AT="${KNOWLEDGE_BUNDLE_OBSERVED_AT}" \
            --build-arg RELEASE_ID="${GIT_COMMIT_SHA}" \
            --tag "${IMAGE_REF}" \
            .

      # #2352 D1: the public website's CSP nonce is derived from RELEASE_ID at
      # RUNTIME, so the build arg has to survive into the finished image's own
      # environment. The Dockerfile warns during the build; this fails the job,
      # because a silent fallback to a per-process nonce would mean a page stored
      # by one process never hydrating when another one serves it. Reads the value
      # exactly the way src/lib/release-nonce.ts does.
      - name: Assert the release identifier is readable in the image
        run: |
          actual="$(docker run --rm --entrypoint node "${IMAGE_REF}" -e 'process.stdout.write((process.env.RELEASE_ID ?? "").trim())')"
          if [ "${actual}" != "${GIT_COMMIT_SHA}" ]; then
            echo "RELEASE_ID in the image is '${actual}', expected '${GIT_COMMIT_SHA}'." >&2
            echo "The build arg did not reach the runtime ENV — see the RELEASE_ID block in Dockerfile." >&2
            exit 1
          fi
          echo "RELEASE_ID is readable in the image and matches the built commit."

      # REQUIRED GATE. A CRITICAL finding fails this step, fails the job, and
      # therefore blocks the merge (#2686, owner decision 9 Aug 2026). The step
      # name says "required" so a reviewer reading the checks list can tell this
      # apart from the advisory step below without opening the workflow.
      - name: Trivy CRITICAL gate (REQUIRED — a finding here blocks the merge)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      # ADVISORY. HIGH findings stay warning-only under the same decision, so
      # this step keeps `continue-on-error: true` and cannot fail the required
      # job. Promoting HIGH to blocking is a separate policy change — see
      # docs/MAINTENANCE.md → "Supply-Chain And Deployment Security Policy".
      - name: Trivy HIGH report (ADVISORY — never blocks the merge)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          severity: HIGH
          skip-setup-trivy: true

  publish-ghcr-images:
    name: Publish GHCR images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - verify
      - migration-drift
      # #2418: a data-rewriting migration whose fixture fails (a wrong post-state,
      # or a mutant that goes undetected) must NOT ship an image an operator would
      # apply to a live club database. The executing job is not yet a required PR
      # check (branch protection is an owner action), so gate the release on it
      # here — the same way migration-drift, its sibling schema gate, already is.
      - data-migration-verification
      - static-analysis
      # #2686: renamed from `gitleaks-full-repo`, which scanned only the pushed
      # commit range despite its name. `secret-scan` does the range AND the
      # history.
      - secret-scan
      - docker-image-security
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ${{ vars.GHCR_APP_IMAGE_REPOSITORY || format('ghcr.io/{0}/alpineclubbookingsnz-app', github.repository_owner) }}:${{ github.sha }}
      MIGRATE_IMAGE: ${{ vars.GHCR_MIGRATE_IMAGE_REPOSITORY || format('ghcr.io/{0}/alpineclubbookingsnz-migrate', github.repository_owner) }}:${{ github.sha }}
      # Stripe credentials are DB-only (#2082) — no Stripe build args or env here.
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # AID-3 (#2372): stamp the shipped knowledge bundle with a verified,
      # reproducible commit SHA + observed-at (the in-builder generator has no
      # `.git`).
      - name: Resolve knowledge-bundle build metadata
        run: |
          echo "GIT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KNOWLEDGE_BUNDLE_OBSERVED_AT=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # RELEASE_ID (#2352 D1) is passed HERE because this is the image production
      # runs, and it was the one missing the argument: docker-image-security passed
      # it to a throwaway scan image and asserted on that, while the published
      # image was built without it and nothing checked. The deploy script's own
      # export could not cover for it either — prepare_application_images()
      # returns early when using prebuilt images, which is the ordinary GHCR path.
      # Slice-1 review finding.
      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.APP_IMAGE }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            GIT_COMMIT_SHA=${{ env.GIT_COMMIT_SHA }}
            KNOWLEDGE_BUNDLE_OBSERVED_AT=${{ env.KNOWLEDGE_BUNDLE_OBSERVED_AT }}
            RELEASE_ID=${{ env.GIT_COMMIT_SHA }}
          cache-from: type=gha,scope=alpineclubbookingsnz-app
          cache-to: type=gha,mode=max,scope=alpineclubbookingsnz-app

      # The assertion moved onto the artefact that ships. docker-image-security
      # still asserts on its own scan image, which is the earlier signal; this is
      # the one DEPLOYMENT.md and docs/SECURITY-ATTACK-SURFACE.md are describing
      # when they say the release identifier is readable in the deployed image.
      - name: Assert RELEASE_ID is readable in the PUBLISHED app image
        run: |
          actual="$(docker run --rm --entrypoint node "${APP_IMAGE}" -e 'process.stdout.write((process.env.RELEASE_ID ?? "").trim())')"
          if [ "${actual}" != "${GIT_COMMIT_SHA}" ]; then
            echo "RELEASE_ID in ${APP_IMAGE} is '${actual}', expected '${GIT_COMMIT_SHA}'." >&2
            echo "Public website pages would fall back to a per-build nonce seed — see src/lib/release-nonce.ts." >&2
            exit 1
          fi
          echo "RELEASE_ID is readable in the published app image and matches the built commit."

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: builder
          push: true
          tags: ${{ env.MIGRATE_IMAGE }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            GIT_COMMIT_SHA=${{ env.GIT_COMMIT_SHA }}
            KNOWLEDGE_BUNDLE_OBSERVED_AT=${{ env.KNOWLEDGE_BUNDLE_OBSERVED_AT }}
          cache-from: type=gha,scope=alpineclubbookingsnz-migrate
          cache-to: type=gha,mode=max,scope=alpineclubbookingsnz-migrate
