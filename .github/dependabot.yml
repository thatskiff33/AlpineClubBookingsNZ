version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait 7 days before proposing updates to newly published versions so a
    # compromised or unstable release has time to be yanked before we adopt it.
    cooldown:
      default-days: 7
    ignore:
      # Keep Node runtime types aligned with package.json engines.
      # Remove this when the app runtime moves beyond Node 24.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Vitest 5 is a migration, not a bump (#3418). These two packages are
      # peer-locked to each other, so Dependabot proposes them as two separate
      # pull requests that each block the other and go red at install in under
      # thirty seconds - neither can ever pass alone. Left unpinned, every new
      # 5.x republishes that pair and a list with two permanent reds in it is a
      # list where a real failure is harder to see.
      #
      # REMOVING THESE TWO ENTRIES IS THE FIRST COMMIT OF THE MIGRATION BRANCH.
      # They are scoped to these packages only, so nothing else is suppressed.
      - dependency-name: "vitest"
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Keep production images on Active/Maintenance LTS Node releases.
      # Remove this once Node 26 enters Active LTS.
      - dependency-name: node
        versions: [">= 26, < 27"]
