rules:
  - id: acb-client-server-boundary
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      references:
        - https://github.com/thatskiff33/AlpineClubBookingsNZ/issues/2686
    message: >-
      INV-OPS-013: a `"use client"` module is compiled into the browser bundle,
      and so is everything it pulls in at runtime. This file reaches a
      server-only module, which ships database access, session/credential code
      or Node built-ins to every visitor. A re-export (`export { x } from …`,
      `export * from …`) and a dynamic `import()`/`require()` have exactly the
      same bundle effect as a plain import and are reported the same way. Move
      the work behind an API route or a server component and pass the RESULT to
      the client component, or — if you only need the shape — make it
      `import type`, which is erased at compile time and is not matched by this
      rule. See docs/invariants/operations.md#inv-ops-013.
    patterns:
      # The banned-module alternation below is a FIXED LIST, and it is the whole
      # of the rule: a module that is not spelled in it is not covered, however
      # server-only its own docblock says it is. Every `@/lib` module in it that
      # EXISTS now carries `import "server-only"` as well — the last three,
      # `club-time-zone-env` (#2989), `environment-role-declaration` and
      # `environment-role` (#3034), were marked by #3204, and `club-format-env`
      # (#3563) was marked on arrival — and they stay listed
      # here anyway. `@/lib/session` and `@/lib/env` name no file, so there is
      # nothing to mark and this list is the ONLY thing standing between a module
      # created at either path and the browser: do not delete an entry on the
      # grounds that the build now catches it. This rule is the
      # half of INV-OPS-013 that answers in REVIEW, on one file, with no build,
      # and deleting an entry because a build now also catches it would trade a
      # cheap always-on check for a slower one. The one home for the reasoning is
      # docs/invariants/operations.md -> INV-OPS-013.
      #
      # Why these four are in the list at all: Next inlines `NEXT_PUBLIC_*`, so
      # importing `club-time-zone-env` from a
      # client component answers from the BUILD-TIME `NEXT_PUBLIC_TZ` instead of
      # from the running server: the split-brain `INV-CONFIG-002` forbids. Its
      # pure sibling `club-time-zone` is NOT in the list, on purpose — the admin
      # panel needs its zone list. `club-format-env` (#3563) is the same pair
      # for the same reason, and worse: NEXT_PUBLIC_CURRENCY has no Dockerfile
      # build argument, so a client-side read inlines `undefined` in the
      # published image and every club silently falls back to NZD. Its pure
      # sibling `club-format` is NOT in the list either. `environment-role-declaration` and
      # `environment-role` join it on sharper grounds: the declaration module
      # reads `process.env.APP_ENVIRONMENT_ROLE`, and a non-public variable
      # inlines as `undefined` in a browser — so a client import would read
      # "nothing has declared this installation" while the server reads
      # `production`, and what is keyed on that answer is whether real members
      # get emailed (INV-CONFIG-003). Note the `$` anchor: `environment-role`
      # cannot match `environment-role-declaration`, so both spellings are
      # needed.
      # Keep this alternation and `FORBIDDEN_MODULES`
      # in `src/lib/__tests__/client-server-boundary-census.test.ts` in step.
      #
      # The `"use client"` directive must be the module's first statement for
      # Next.js to honour it, so anchoring on it here is the same condition the
      # bundler applies.
      - pattern-inside: |
          "use client"
          ...
      - pattern-either:
          # STATIC forms: `import …`, and — this is the half the first draft
          # missed — `export … from …`. A re-export is not a lighter thing than
          # an import: `export { prisma } from "@/lib/prisma"` evaluates the
          # module and puts it in the bundle exactly as an import does, while
          # reading like innocuous barrel plumbing. Default, named, namespace
          # and bare side-effect (`import "server-only"`) are all covered.
          #
          # `import type …` / `export type …` are excluded by the negative
          # lookahead, which is `type[\s{]` rather than `type\s`: TypeScript
          # accepts `import type{ Session } from …` with no space, and the
          # `type\s` form reported that as a violation.
          - patterns:
              - pattern-regex: >-
                  (?m)^[ \t]*(?:import|export)\s+(?!type[\s{])(?:[^;'"]*?\bfrom\s+)?["'](?P<MOD>[^"']+)["']
              - metavariable-regex:
                  metavariable: $MOD
                  regex: >-
                    ^(?:server-only|next/headers|(?:@/lib|\.{1,2}(?:/\.\.)*(?:/lib)?)/(?:prisma|auth|audit|session|email|xero|stripe|env|club-time-zone-env|club-format-env|environment-role-declaration|environment-role)|node:.+|(?:assert|async_hooks|buffer|child_process|cluster|console|constants|crypto|dgram|diagnostics_channel|dns|domain|events|fs|http|http2|https|inspector|module|net|os|path|perf_hooks|process|punycode|querystring|readline|repl|sqlite|stream|string_decoder|sys|timers|tls|trace_events|tty|url|util|v8|vm|wasi|worker_threads|zlib)(?:/.*)?)$
          # DYNAMIC forms. `await import("@/lib/prisma")` and
          # `require("@/lib/auth")` are not statements the static regex above
          # can see, and both put the module in the client bundle — `import()`
          # as a lazily-fetched chunk, which is still shipped and still
          # readable. Matched as AST so they are found wherever they sit:
          # inside a handler, a `useEffect`, a helper.
          - patterns:
              - pattern-either:
                  - pattern: import($MOD)
                  - pattern: require($MOD)
              - metavariable-regex:
                  metavariable: $MOD
                  # The AST metavariable binds the string literal WITH its
                  # quotes, so the quotes are optional-matched here rather than
                  # stripped.
                  regex: >-
                    ^["']?(?:server-only|next/headers|(?:@/lib|\.{1,2}(?:/\.\.)*(?:/lib)?)/(?:prisma|auth|audit|session|email|xero|stripe|env|club-time-zone-env|club-format-env|environment-role-declaration|environment-role)|node:.+|(?:assert|async_hooks|buffer|child_process|cluster|console|constants|crypto|dgram|diagnostics_channel|dns|domain|events|fs|http|http2|https|inspector|module|net|os|path|perf_hooks|process|punycode|querystring|readline|repl|sqlite|stream|string_decoder|sys|timers|tls|trace_events|tty|url|util|v8|vm|wasi|worker_threads|zlib)(?:/.*)?)["']?$
    paths:
      exclude:
        # Fixtures for this rule are deliberate violations. Anchored with a
        # leading `/` (repo-root-relative): an unanchored glob is deprecated
        # under Semgrepignore v2 and prints a warning on every run.
        - /.semgrep/tests/**
